<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0891b2">
<title>404 Gaming Zone — Build Your Own Slot</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#e8eef5; --bg-2:#dde6ef; --surface:rgba(255,255,255,.62); --surface-3:rgba(255,255,255,.82);
  --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.16);
  --text:#0b1726; --text-dim:#475569; --text-faint:#94a3b8;
  --accent:#0891b2; --accent-strong:#0e7490; --accent-soft:#67e8f9; --violet:#8b5cf6;
  --warning:#f59e0b; --danger:#ef4444; --ok:#059669;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 20px 50px -10px rgba(15,76,129,.18),0 8px 24px -8px rgba(15,76,129,.12);
  --shadow-sm:0 1px 0 rgba(255,255,255,.6) inset,0 8px 24px -6px rgba(15,76,129,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(60% 40% at 15% 0%,rgba(103,232,249,.35),transparent 70%),radial-gradient(50% 40% at 95% 10%,rgba(139,92,246,.18),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:18px 16px 150px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.mono{font-family:'JetBrains Mono',monospace}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:40px;line-height:1.02;letter-spacing:-.03em;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;letter-spacing:-.02em;font-weight:700;line-height:1.15}
.sub{color:var(--text-dim);margin-top:8px}
.glass{background:var(--surface);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card{padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;font-weight:700;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--accent),#4f6bd8);box-shadow:0 10px 24px -8px rgba(8,145,178,.55);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.985)}
.btn[disabled]{background:#cbd5e1;box-shadow:none;cursor:not-allowed;color:#fff}
.btn.ghost{background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);box-shadow:none}
.hero{padding:26px 0 20px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.fact{padding:14px 8px;text-align:center}
.fact b{display:block;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;white-space:nowrap}
.fact span{font-size:11px;color:var(--text-dim)}
.how{margin-top:16px;display:grid;gap:8px}
.how .glass{display:flex;gap:14px;align-items:center;padding:14px 16px}
.num{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#fff;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px}
.how b{display:block;font-size:15px}.how small{color:var(--text-dim);font-size:13px}
.foot{margin-top:22px;text-align:center;color:var(--text-faint);font-size:12px;line-height:1.7}
.prog{display:flex;gap:6px;margin-bottom:18px}
.prog i{flex:1;height:5px;border-radius:9px;background:rgba(15,23,42,.1)}
.prog i.on{background:linear-gradient(90deg,var(--accent),var(--violet))}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{position:relative;text-align:left;padding:16px;min-height:84px;display:flex;flex-direction:column;justify-content:center;border:1.5px solid var(--border);transition:border-color .15s,transform .15s}
.opt:hover{transform:translateY(-1px);border-color:var(--border-strong)}
.opt.sel{border-color:var(--accent);background:rgba(8,145,178,.08)}
.opt[disabled]{opacity:.5;cursor:not-allowed;border-style:dashed;box-shadow:none}
.opt[disabled]:hover{transform:none}
.opt.sel::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.opt .big{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em}
.opt .t{font-weight:700;font-size:16px}
.opt .s{font-size:12.5px;color:var(--text-dim);margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:74px;padding:10px 12px;text-align:center;border:1.5px solid var(--border)}
.chip b{display:block;font-size:14px}.chip span{font-size:11px;color:var(--text-dim)}
.chip.sel{background:var(--text);color:#fff;border-color:var(--text)}.chip.sel span{color:#cbd5e1}
.lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 8px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px}
.stepper .v{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700;text-align:center}
.rb{width:50px;height:50px;border-radius:12px;background:rgba(15,23,42,.06);font-size:24px;display:grid;place-items:center}
.rb[disabled]{opacity:.35;cursor:not-allowed}
.grp{font-size:11px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:.12em;margin:14px 0 8px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{min-height:56px;border:1.5px solid var(--border);font-weight:700;font-size:15px}
.time small{display:block;font-size:11px;font-weight:500;color:var(--text-dim)}
.time.sel{background:linear-gradient(135deg,var(--accent),#4f6bd8);border-color:transparent;color:#fff}.time.sel small{color:rgba(255,255,255,.8)}
.time[disabled]{background:transparent;box-shadow:none;border-style:dashed;color:var(--text-faint);cursor:not-allowed}
.time[disabled] small{color:var(--text-faint)}
.field{margin-top:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--border-strong);padding:0 16px;background:var(--surface-3);outline:none;font-size:16px}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(8,145,178,.15)}
.line{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px}
.line:last-child{border-bottom:0}.line span{color:var(--text-dim)}.line b{text-align:right}
.amount{font-family:'Bricolage Grotesque',sans-serif;font-size:36px;font-weight:800;letter-spacing:-.03em}
.acct{margin-top:10px;font-size:14px;line-height:1.7}.acct b{font-family:'JetBrains Mono',monospace}
.up{display:block;margin-top:12px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;background:var(--surface)}
.up.has{border-style:solid;border-color:var(--ok);background:rgba(5,150,105,.08)}
.up img{max-height:130px;border-radius:10px;display:block;margin:0 auto 8px}
.tiny{font-size:12.5px;color:var(--text-dim)}
.rules{margin-top:16px;display:grid;gap:8px;font-size:12.5px;color:var(--text-dim)}
.rules div{padding-left:14px;position:relative}.rules div::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(232,238,245,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border)}
.bar-in{max-width:540px;margin:0 auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.slot{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--text-dim)}
.slot .d{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .d b{color:var(--text)}
.slot .p{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);font-size:16px}
.row{display:flex;gap:10px}
.row .back{flex:none;width:56px;background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);box-shadow:none}
.st{display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:6px 10px;white-space:nowrap}
.st.pending{background:#fef3c7;color:#92400e}.st.confirmed{background:#d1fae5;color:#065f46}.st.declined,.st.cancelled,.st.released{background:#fee2e2;color:#991b1b}.st.completed{background:#e2e8f0;color:#475569}
.err{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fee2e2;color:#991b1b;font-size:14px;font-weight:500}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(15,23,42,.12);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:70px auto 20px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.bk{display:block;width:100%;text-align:left;border:1.5px solid var(--border);transition:border-color .15s,transform .15s}
.bk:hover{border-color:var(--border-strong);transform:translateY(-1px)}
.bk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bk-main{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;margin:8px 0 2px}
.ur{display:block;font-size:13px;color:var(--text-dim);font-weight:500;margin-top:4px}
.btn .ur{color:rgba(255,255,255,.85);font-size:12px;margin:0}
.btn.two{flex-direction:column;gap:2px;min-height:64px}
.btn.ghost .ur{color:var(--text-dim)}
.tt{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;margin-top:8px}
.tt th{font-family:'Bricolage Grotesque',sans-serif;font-size:15px;font-weight:700;padding:6px 0}
.tt th small{display:block;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:500;color:var(--text-dim)}
.tt td.t{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-align:right;padding-right:4px;white-space:nowrap}
.tt td button,.tt td span{display:grid;place-items:center;width:100%;height:42px;border-radius:10px;font-size:11.5px;font-weight:700}
.tt td button{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.tt td button:active{transform:scale(.96)}
.tt td span{background:repeating-linear-gradient(135deg,rgba(15,23,42,.08) 0 6px,transparent 6px 12px);color:var(--text-faint);border:1px solid var(--border)}
.key{display:flex;gap:14px;font-size:12px;color:var(--text-dim);margin-top:10px;align-items:center}
.key i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
@media(max-width:380px){h1{font-size:34px}}
</style>

<body>
<div id="app"><div class="wrap center"><div class="spin"></div><p class="sub">Loading…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   404 Gaming Zone — Build Your Own Slot (customer booking page)
   Talks to the TEST database only. Customers are not signed in: every
   write goes through a database function that checks the rules.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL : "https://bxviqxrbyjtsrfwtmsbe.supabase.co",
  SUPABASE_KEY : "sb_publishable_tqCGSzSoWPU-coZr6SGzwQ_MPmv74b-",
  WHATSAPP     : "923244099700"
};
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth:{ persistSession:false } });

const H = 3600000, OPEN = 9, CLOSE_AFTER = 18;         // open 9 AM, for 18 hours (until 3 AM)
const PKT = 5 * H;                                       // Lahore is UTC+5, no daylight saving
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs  = n => 'Rs ' + Math.round(n).toLocaleString('en-PK');
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pk  = ms => new Date(ms + PKT);                    // read with getUTC* to get Lahore wall time
const hl  = ms => { const h = pk(ms).getUTCHours(); return (h % 12 || 12) + ' ' + (h < 12 ? 'AM' : 'PM'); };
/* A business day starts at 9 AM Lahore time. Before 9 AM we are still in yesterday's night. */
function dayStart(offset){
  const now = Date.now(), p = pk(now);
  let base = Date.UTC(p.getUTCFullYear(), p.getUTCMonth(), p.getUTCDate(), OPEN) - PKT;
  if (now < base) base -= 24 * H;
  return base + offset * 24 * H;
}
const dayLabel = o => o === 0 ? 'Today' : o === 1 ? 'Tomorrow' : WD[pk(dayStart(o)).getUTCDay()];
const dayDate  = o => { const p = pk(dayStart(o)); return p.getUTCDate() + ' ' + MO[p.getUTCMonth()]; };
const whenText = (start, end) => { const p = pk(start); const late = p.getUTCHours() < OPEN ? ' (after midnight)' : '';
  return WD[p.getUTCDay()] + ' ' + p.getUTCDate() + ' ' + MO[p.getUTCMonth()] + ', ' + hl(start) + ' – ' + hl(end) + late; };

const S = { view:'home', step:1, machines:[], info:{rate:400,extra:100,advance_pct:50}, taken:[], busy:false, err:'',
            sel:null, receipt:null, mine:[], find:{ no:'', phone:'', err:'' }, fromGrid:false, gfilter:null };
const fresh = () => ({ m:null, game:null, day:0, start:null, hours:1, players:2, name:'', phone:'', full:false, file:null, preview:null });
S.sel = fresh();
const price = () => S.sel.hours * (S.info.rate + Math.max(0, S.sel.players - 2) * S.info.extra);
const due   = () => S.sel.full ? price() : Math.ceil(price() * S.info.advance_pct / 100);
const phoneOk = p => /^03[0-9]{9}$/.test(p.replace(/[\s-]/g, ''));
const ready = () => S.sel.name.trim().length > 1 && phoneOk(S.sel.phone) && !!S.sel.file;
const isTaken = (m, start, end) => S.taken.some(t => t.machine_id === m && start < t.end_time && t.start_time < end);

async function loadBase(){
  const [m, i] = await Promise.all([
    sb.from('gz_machines').select('id,platform,games,sort').eq('active', true).eq('bookable', true).order('sort'),
    sb.rpc('gz_public_booking_info')
  ]);
  if (m.error) throw m.error;
  S.machines = m.data || [];
  if (i.data) S.info = Object.assign(S.info, i.data);
}
async function loadTaken(){
  const from = dayStart(S.sel.day), to = from + CLOSE_AFTER * H;
  const { data, error } = await sb.rpc('gz_public_slots', { p_from: from, p_to: to });
  if (!error) S.taken = data || [];
}

const app = document.getElementById('app');
function render(){
  if (S.busy) { app.innerHTML = `<div class="wrap center"><div class="spin"></div><h2>${esc(S.busy)}</h2><p class="sub">This takes a few seconds.</p></div>`; return; }
  app.innerHTML = S.view === 'home' ? home() : S.view === 'receipt' ? receipt() : S.view === 'grid' ? grid() : S.view === 'mine' ? mine() : builder();
}
const head = () => `<header><div class="brand">404 <span>Gaming Zone</span></div><span class="tag">Build your own slot</span></header>`;
function home(){
  const saved = savedBookings();
  return `<div class="wrap">${head()}
   <div class="hero"><h1>Build your<br>own <em>slot.</em></h1><p class="sub">Pick a machine, a game and a time. Done in one minute.</p></div>
   <button class="btn two" data-a="grid"><span>Build my slot →</span><span class="ur">Apna slot book karein</span></button>
   <button class="btn ghost two" style="margin-top:10px" data-a="mine"><span>My bookings${saved.length ? ' (' + saved.length + ')' : ''}</span><span class="ur">Meri bookings dekhein</span></button>
   <div class="facts"><div class="fact glass"><b>${rs(S.info.rate)}</b><span>per hour</span></div><div class="fact glass"><b>2 players</b><span>included</span></div><div class="fact glass"><b>9AM – 3AM</b><span>every day</span></div></div>
   <div class="how"><div class="glass"><span class="num">1</span><div><b>Build your slot</b><small>Machine, game, time and players.</small></div></div>
   <div class="glass"><span class="num">2</span><div><b>Pay ${S.info.advance_pct}% now</b><small>Send the advance and upload the screenshot.</small></div></div>
   <div class="glass"><span class="num">3</span><div><b>Come and play</b><small>Your machine is ready at your time.</small></div></div></div>
   <p class="foot">Sami Town, Azizpull, Taj Bagh Scheme, Lahore<br>0324 4099700</p></div>`;
}
/* The timetable: every machine, hour by hour, for one day. Shows only free
   or booked. Names and games of other people's bookings are never sent here. */
function grid(){
  const s = S.sel, base = dayStart(s.day), rows = [];
  for (let i = 0; i < CLOSE_AFTER; i++) {
    const start = base + i * H; if (start + H <= Date.now()) continue;
    const past = start < Date.now();
    rows.push(`<tr><td class="t">${hl(start)}</td>` + S.machines.map(m => (S.gfilter && !(m.games || []).includes(S.gfilter))
      ? `<td><span title="This machine does not have ${esc(S.gfilter)}">✕</span></td>`
      : (past || isTaken(m.id, start, start + H))
      ? `<td><span>${past ? '—' : 'Booked'}</span></td>`
      : `<td><button data-a="cell" data-m="${esc(m.id)}" data-v="${start}">Free</button></td>`).join('') + `</tr>`);
  }
  return `<div class="wrap">${head()}<div class="prog">${STEPS.map((_, i) => `<i class="${i < 1 ? 'on' : ''}"></i>`).join('')}</div>
   <div class="tag" style="margin-bottom:8px">Step 1 of 5 · Time</div>
   <h2>Pick your time</h2><span class="ur">Hara dabba khali hai. Us par tap karein.</span>
   <div class="chips">${[0,1,2,3,4,5,6].map(d => `<button class="chip glass ${s.day === d ? 'sel' : ''}" data-a="gday" data-v="${d}"><b>${dayLabel(d)}</b><span>${dayDate(d)}</span></button>`).join('')}</div>
   <div class="lab" style="margin-top:14px">Which game? · Kaun si game?</div>
   <div class="chips" style="margin-top:0">${[null].concat([...new Set(S.machines.flatMap(m => m.games || []))]).map(g => `<button class="chip glass ${S.gfilter === g ? 'sel' : ''}" style="min-width:0" data-a="gfilter" data-v="${g == null ? '' : esc(g)}"><b>${g == null ? 'Any game' : esc(g)}</b></button>`).join('')}</div>
   <div class="key"><span><i style="background:#d1fae5;border:1px solid #6ee7b7"></i>Free · tap to book</span><span><i style="background:rgba(15,23,42,.12)"></i>Booked</span>${S.gfilter ? `<span>✕ no ${esc(S.gfilter)} on that machine</span>` : ''}</div>
   ${rows.length ? `<table class="tt"><tr><th></th>${S.machines.map(m => `<th>${esc(m.id)}<small>${esc((m.platform || '').toUpperCase())}</small></th>`).join('')}</tr>${rows.join('')}</table>`
     : '<p class="sub center" style="padding:30px 0">No times left on this day. Try another day.</p>'}
   ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}
   <button class="btn ghost" style="margin-top:16px" data-a="home">← Back</button></div>`;
}
const STEPS = ['Time','Game','Hours','Players','Pay'];
const UR = ['Hara dabba khali hai. Us par tap karein.','Game chunein','Kitni dair khelna hai?','Kitne log khelenge?','Advance bhejein aur screenshot lagaein'];
function builder(){
  const s = S.sel, st = S.step; let body = '';
  if (st === 2) {
    const m = S.machines.find(x => x.id === s.m);
    body = `<h2>Pick your game</h2><p class="sub">Games on ${esc(s.m)}</p><div class="opts">` + (m.games || []).map(g =>
      `<button class="opt glass ${s.game === g ? 'sel' : ''}" style="min-height:64px" data-a="game" data-v="${esc(g)}"><div class="t">${esc(g)}</div></button>`).join('') + `</div>`;
  }
  if (st === 3) {
    /* How long? Starting from the hour they tapped, offer every length that is
       still free on this machine, so they can extend into the next hours. */
    const dayEnd = dayStart(s.day) + CLOSE_AFTER * H; let maxH = 0;
    for (let h = 1; h <= 6; h++) { if (s.start + h * H > dayEnd || isTaken(s.m, s.start, s.start + h * H)) break; maxH = h; }
    if (s.hours > maxH) s.hours = Math.max(1, maxH);
    const opts = [];
    for (let h = 1; h <= 6; h++) {
      const end = s.start + h * H, ok = h <= maxH;
      if (!ok && end > dayEnd) break;
      opts.push(`<button class="opt glass ${ok && s.hours === h ? 'sel' : ''}" style="min-height:70px;padding-right:50px" ${ok ? '' : 'disabled'} data-a="hrs2" data-v="${h}">
        <div class="t">${h} hour${h > 1 ? 's' : ''} <span class="mono" style="float:right">${ok ? rs(h * (S.info.rate + Math.max(0, s.players - 2) * S.info.extra)) : ''}</span></div>
        <div class="s">${ok ? hl(s.start) + ' – ' + hl(end) : 'Not free: ' + hl(end - H) + ' is already booked'}</div></button>`);
      if (!ok) break;
    }
    body = `<h2>How long?</h2><p class="sub">${esc(s.m)} · starts ${hl(s.start)}</p><div class="opts">${maxH ? opts.join('') : '<p class="sub center" style="padding:24px 0">This time was just taken. Go back and pick another.</p>'}</div>`;
  }
  if (st === 4) {
    const extra = Math.max(0, s.players - 2);
    body = `<h2>How many players?</h2><p class="sub">2 players are included.</p>
     <div class="stepper glass" style="margin-top:16px"><button class="rb" data-a="pl" data-v="-1" ${s.players <= 1 ? 'disabled' : ''}>−</button><div class="v">${s.players} player${s.players > 1 ? 's' : ''}</div><button class="rb" data-a="pl" data-v="1" ${s.players >= 8 ? 'disabled' : ''}>+</button></div>
     <div class="glass card" style="margin-top:12px"><div class="line"><span>${s.hours} hour${s.hours > 1 ? 's' : ''} × ${rs(S.info.rate)}</span><b>${rs(S.info.rate * s.hours)}</b></div>
     ${extra ? `<div class="line"><span>${extra} extra player${extra > 1 ? 's' : ''} × ${rs(S.info.extra)} × ${s.hours}h</span><b>${rs(S.info.extra * extra * s.hours)}</b></div>` : ''}
     <div class="line"><span>Total</span><b>${rs(price())}</b></div></div>`;
  }
  if (st === 5) {
    const acct = S.info.account_no ? `<div class="acct">${S.info.account_bank ? esc(S.info.account_bank) + '<br>' : ''}Account title: <b>${esc(S.info.account_title)}</b><br>Account number: <b>${esc(S.info.account_no)}</b></div>`
                                   : `<div class="acct tiny">Payment account details will appear here. (Not set yet.)</div>`;
    body = `<h2>Pay and lock your slot</h2>
     <div class="field"><label for="f-name">Your name</label><input id="f-name" placeholder="Full name" autocomplete="name" value="${esc(s.name)}"></div>
     <div class="field"><label for="f-phone">WhatsApp number</label><input id="f-phone" inputmode="tel" placeholder="03XXXXXXXXX" autocomplete="tel" value="${esc(s.phone)}"></div>
     <div class="lab">How much now?</div>
     <div class="opts two" style="margin-top:0"><button class="opt glass ${!s.full ? 'sel' : ''}" data-a="full" data-v="0"><div class="t">${S.info.advance_pct}% advance</div><div class="s">${rs(Math.ceil(price() * S.info.advance_pct / 100))} now, rest at the counter</div></button>
     <button class="opt glass ${s.full ? 'sel' : ''}" data-a="full" data-v="1"><div class="t">Full</div><div class="s">${rs(price())} now. Seat held even if you are late</div></button></div>
     <div class="glass card" style="margin-top:12px"><div class="tiny">Send exactly</div><div class="amount">${rs(due())}</div>${acct}</div>
     <label class="up ${s.file ? 'has' : ''}"><input type="file" accept="image/png,image/jpeg,image/webp" id="f-proof" hidden>
      ${s.file ? `${s.preview ? `<img src="${s.preview}" alt="">` : ''}<b>Screenshot added ✓</b><div class="tiny">Tap to change</div>` : `<b>Upload payment screenshot</b><div class="tiny">Tap here and choose the screenshot</div>`}</label>
     ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}
     <div class="rules"><div>Pay at least ${S.info.advance_pct}% to book. The rest is paid at the counter.</div><div>Your time starts at the booked time. 30 minutes late without full payment, the seat may go to someone else.</div><div>To cancel, tell us at least 12 hours before.</div></div>`;
  }
  const parts = [s.m, s.game, s.start != null ? whenText(s.start, s.start + s.hours * H) : null, st >= 4 ? s.players + ' player' + (s.players > 1 ? 's' : '') : null].filter(Boolean);
  const can = st === 2 ? !!s.game : st === 3 ? (s.start != null && !isTaken(s.m, s.start, s.start + s.hours * H)) : st === 4 ? true : ready();
  return `<div class="wrap">${head()}<div class="prog">${STEPS.map((_, i) => `<i class="${i < st ? 'on' : ''}"></i>`).join('')}</div>
   <div class="tag" style="margin-bottom:8px">Step ${st} of 5 · ${STEPS[st - 1]}</div>${body.replace('</h2>', '</h2><span class="ur">' + UR[st - 1] + '</span>')}</div>
   <div class="bar"><div class="bar-in"><div class="slot"><div class="d"><b>Your slot</b> · ${parts.length ? esc(parts.join(' · ')) : 'nothing picked yet'}</div>${s.start != null ? `<div class="p">${rs(price())}</div>` : ''}</div>
   <div class="row"><button class="btn back" data-a="back" aria-label="Back">←</button><button class="btn" id="go" data-a="next" ${can ? '' : 'disabled'}>${st === 5 ? 'Lock my slot · Slot pakka karein' : 'Continue · Agay'}</button></div></div></div>`;
}
const stLabel = { pending:'Verifying payment', confirmed:'Confirmed', declined:'Not confirmed', cancelled:'Cancelled', released:'Seat released', completed:'Completed' };
function receipt(){
  const b = S.receipt; if (!b) return home();
  const head2 = b.state === 'confirmed' ? ['Slot confirmed.', 'See you ' + whenText(b.start_time, b.end_time).split(' – ')[0] + '.']
              : b.state === 'declined'  ? ['Payment not confirmed', 'Reason: ' + (b.decline_reason || 'payment not received') + '. Message us on WhatsApp and we will sort it out.']
              : b.state === 'cancelled' ? ['Booking cancelled', (b.cancel_reason ? 'Reason: ' + b.cancel_reason + '. ' : '') + 'Message us on WhatsApp about your payment.']
              : b.state === 'pending'   ? ['Slot built.', 'Your slot is locked. We are checking your payment and will confirm shortly.']
              : [stLabel[b.state] || 'Booking', ''];
  return `<div class="wrap">${head()}<div class="hero" style="padding-bottom:6px"><h2>${esc(head2[0])}</h2><p class="sub">${esc(head2[1])}</p></div>
   <div class="glass card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px dashed var(--border-strong)">
     <div><div class="tag">Booking</div><div class="mono" style="font-size:20px;font-weight:700">#${esc(b.booking_no)}</div></div><span class="st ${esc(b.state)}">${esc(stLabel[b.state] || b.state)}</span></div>
    <div class="line"><span>Machine</span><b>${esc(b.machine_id)}</b></div><div class="line"><span>Game</span><b>${esc(b.game)}</b></div>
    <div class="line"><span>When</span><b>${esc(whenText(b.start_time, b.end_time))}</b></div><div class="line"><span>Players</span><b>${esc(b.players)}</b></div>
    <div class="line"><span>Total</span><b>${rs(b.total)}</b></div>
    <div class="line"><span>${b.state === 'pending' ? 'Sent (being checked)' : 'Paid'}</span><b>${rs(b.state === 'pending' ? (b.claimed || 0) : b.paid)}</b></div>
    <div class="line"><span>Pay at counter</span><b>${rs(Math.max(0, b.total - (b.state === 'pending' ? (b.claimed || 0) : b.paid)))}</b></div></div>
   <div class="rules"><div>Your time starts at ${hl(b.start_time)}, even if you arrive late.</div><div>To cancel, tell us at least 12 hours before.</div><div>Keep your booking number. You will need it with your phone number.</div></div>
   <a class="btn ghost" style="margin-top:18px;text-decoration:none" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent('Booking #' + b.booking_no)}" target="_blank" rel="noopener">Message 404 on WhatsApp</a>
   <button class="btn" style="margin-top:10px" data-a="mine">See all my bookings</button>
   <button class="btn ghost" style="margin-top:10px" data-a="start">Build another slot</button>
   <p class="foot">Sami Town, Azizpull, Taj Bagh Scheme, Lahore · 0324 4099700</p></div>`;
}

/* Bookings made on this phone are remembered here, so the customer can come
   back to all of them. A booking made on another phone can be added with its
   booking number and phone number. */
function savedBookings(){
  let list = [];
  try { list = JSON.parse(localStorage.getItem('g404_bookings') || '[]') || []; } catch(e){ list = []; }
  try { const old = JSON.parse(localStorage.getItem('g404_booking') || 'null');     // the earlier single-booking memory
        if (old && old.no && !list.some(x => x.no === old.no)) { list.push(old); localStorage.setItem('g404_bookings', JSON.stringify(list)); }
        localStorage.removeItem('g404_booking'); } catch(e){}
  return Array.isArray(list) ? list : [];
}
function rememberBooking(no, phone, claimed){
  const list = savedBookings().filter(x => x.no !== no); list.push({ no, phone, claimed });
  try { localStorage.setItem('g404_bookings', JSON.stringify(list)); } catch(e){}
}
async function fetchBooking(x){
  const { data } = await sb.rpc('gz_booking_status', { p_booking_no: x.no, p_phone: x.phone });
  return data ? Object.assign({ claimed: x.claimed || 0 }, data) : null;
}
async function loadMine(){
  const rows = (await Promise.all(savedBookings().map(fetchBooking))).filter(Boolean);
  const now = Date.now();
  /* What is coming up first (soonest on top), then what has passed (most recent on top). */
  S.mine = rows.filter(b => b.end_time >= now).sort((a, b) => a.start_time - b.start_time)
     .concat(rows.filter(b => b.end_time < now).sort((a, b) => b.start_time - a.start_time));
  if (S.receipt) { const r = S.mine.find(b => b.booking_no === S.receipt.booking_no); if (r) S.receipt = r; }
}
function mine(){
  const now = Date.now(), list = S.mine || [];
  const card = b => { const shown = b.state === 'pending' ? (b.claimed || 0) : b.paid, left = Math.max(0, b.total - shown), past = b.end_time < now;
    return `<button class="glass card bk" style="${past ? 'opacity:.65' : ''}" data-a="open" data-v="${esc(b.booking_no)}">
      <div class="bk-top"><span class="mono" style="font-weight:700">#${esc(b.booking_no)}</span><span class="st ${esc(b.state)}">${esc(stLabel[b.state] || b.state)}</span></div>
      <div class="bk-main">${esc(b.machine_id)} · ${esc(b.game)}</div><div class="tiny">${esc(whenText(b.start_time, b.end_time))} · ${b.players} player${b.players > 1 ? 's' : ''}</div>
      <div class="tiny" style="margin-top:6px">${['declined','cancelled','released'].includes(b.state) ? 'Not active' : (b.state === 'pending' ? 'Payment being checked · ' : '') + (left > 0 ? 'Pay at counter: <b style="color:var(--text)">' + rs(left) + '</b>' : b.state === 'pending' ? 'nothing more to pay if approved' : 'Fully paid')}</div></button>`; };
  return `<div class="wrap">${head()}<h2>My bookings</h2><span class="ur">Aap ki tamam bookings</span>
   <div class="opts">${list.length ? list.map(card).join('') : '<p class="sub center" style="padding:24px 0">No bookings on this phone yet.</p>'}</div>
   <div class="lab">Booked from another phone?</div>
   <div class="glass card"><div class="tiny">Enter the booking number and the phone number used.</div>
    <div class="field"><input id="q-no" inputmode="numeric" placeholder="Booking number, like 1005" value="${esc(S.find.no)}"></div>
    <div class="field"><input id="q-phone" inputmode="tel" placeholder="03XXXXXXXXX" value="${esc(S.find.phone)}"></div>
    ${S.find.err ? `<div class="err">${esc(S.find.err)}</div>` : ''}
    <button class="btn ghost" style="margin-top:12px" data-a="find">Find booking</button></div>
   <button class="btn" style="margin-top:16px" data-a="start">Build a new slot →</button>
   <button class="btn ghost" style="margin-top:10px" data-a="home">← Back</button></div>`;
}
setInterval(async () => {
  if (!['receipt','mine'].includes(S.view) || S.busy) return;
  if (!(S.mine || []).some(b => b.state === 'pending') && !(S.receipt && S.receipt.state === 'pending')) return;
  const before = JSON.stringify((S.mine || []).map(b => b.state)) + (S.receipt ? S.receipt.state : '');
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  await loadMine();
  if (!typing && before !== JSON.stringify((S.mine || []).map(b => b.state)) + (S.receipt ? S.receipt.state : '')) render();
}, 15000);

function keep(){ const n = document.getElementById('f-name'), p = document.getElementById('f-phone'); if (n) { S.sel.name = n.value; S.sel.phone = p.value; }
  const q = document.getElementById('q-no'), qp = document.getElementById('q-phone'); if (q) { S.find.no = q.value; S.find.phone = qp.value; } }
document.addEventListener('input', e => { if (e.target.id === 'f-name' || e.target.id === 'f-phone') { keep(); const go = document.getElementById('go'); if (go) go.disabled = !ready(); } });
document.addEventListener('change', e => {
  if (e.target.id !== 'f-proof' || !e.target.files[0]) return;
  keep(); const f = e.target.files[0];
  if (f.size > 5 * 1024 * 1024) { S.err = 'That image is larger than 5 MB. Please send a smaller screenshot.'; render(); return; }
  S.err = ''; S.sel.file = f; const r = new FileReader(); r.onload = () => { S.sel.preview = r.result; render(); }; r.readAsDataURL(f);
});
async function submit(){
  const s = S.sel; S.err = ''; S.busy = 'Locking your slot'; render();
  try {
    const ext = (s.file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    const path = new Date().toISOString().slice(0, 10) + '/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.' + ext;
    const up = await sb.storage.from('payment-proofs').upload(path, s.file, { contentType: s.file.type, upsert: false });
    if (up.error) throw new Error('The screenshot could not be uploaded. Please try again.');
    const phone = s.phone.replace(/[\s-]/g, '');
    const { data, error } = await sb.rpc('gz_create_booking', { p_machine: s.m, p_game: s.game, p_start: s.start, p_hours: s.hours, p_players: s.players,
      p_name: s.name.trim(), p_phone: phone, p_amount: due(), p_proof_path: path, p_txn: null });
    if (error) throw new Error(error.message);
    rememberBooking(data.booking_no, phone, due());
    S.receipt = { booking_no: data.booking_no, machine_id: s.m, game: s.game, start_time: s.start, end_time: s.start + s.hours * H, players: s.players,
                  total: data.total, paid: 0, claimed: due(), state: 'pending' };
    S.sel = fresh(); S.step = 1; S.view = 'receipt';
  } catch (e) {
    S.err = e.message || 'Something went wrong. Please try again.';
    if (/just taken/.test(S.err)) { S.sel.m = null; S.sel.start = null; S.view = 'grid'; await loadTaken(); }
  }
  S.busy = false; render(); window.scrollTo(0, 0);
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, s = S.sel; keep();
  const y = window.scrollY, stay = ['hrs2','pl','full'].includes(a);
  if (a === 'start' || a === 'grid') { S.sel = fresh(); S.err = ''; S.view = 'grid'; render(); window.scrollTo(0, 0); await loadTaken(); }
  else if (a === 'mine') { S.busy = 'Loading your bookings'; render(); await loadMine(); S.busy = false; S.find.err = ''; S.view = 'mine'; }
  else if (a === 'open') { S.receipt = (S.mine || []).find(b => String(b.booking_no) === v) || null; S.view = S.receipt ? 'receipt' : 'mine'; }
  else if (a === 'find') {
    const no = parseInt(S.find.no, 10), phone = S.find.phone.replace(/[\s-]/g, '');
    if (!no || !phoneOk(phone)) { S.find.err = 'Enter the booking number and an 11-digit phone number.'; }
    else { S.busy = 'Finding your booking'; render();
      const b = await fetchBooking({ no, phone }); S.busy = false;
      if (!b) S.find.err = 'No booking found with that number and phone.';
      else { rememberBooking(no, phone, 0); S.find = { no:'', phone:'', err:'' }; await loadMine(); } }
  }
  else if (a === 'home') { S.view = 'home'; }
  else if (a === 'gday') { s.day = +v; render(); await loadTaken(); render(); window.scrollTo(0, y); return; }
  else if (a === 'gfilter') { S.gfilter = v || null; render(); window.scrollTo(0, y); return; }
  else if (a === 'cell') { s.m = el.dataset.m; s.start = +v; s.hours = 1; s.game = S.gfilter; s.fromFilter = !!S.gfilter; S.step = S.gfilter ? 3 : 2; S.view = 'build'; }
  else if (a === 'back') {
    /* Came from the timetable: Back returns there, on the same day, not to "Pick your machine". */
    if (S.step <= (s.fromFilter ? 3 : 2)) { s.m = null; s.game = null; s.start = null; s.fromFilter = false; S.view = 'grid'; render(); await loadTaken(); }
    else S.step--;
  }
  else if (a === 'game') { s.game = v; S.step = 3; await loadTaken(); }
  else if (a === 'hrs2') { s.hours = +v; }
  else if (a === 'pl') { s.players = Math.max(1, Math.min(8, s.players + +v)); }
  else if (a === 'full') { s.full = v === '1'; }
  else if (a === 'next') { if (S.step < 5) S.step++; else if (ready()) { await submit(); return; } }
  render(); window.scrollTo(0, stay ? y : 0);
});

(async () => {
  try { await loadBase(); render(); }
  catch (e) { app.innerHTML = `<div class="wrap">${head()}<div class="err">We could not load the booking page. Please check your internet and try again.</div></div>`; }
})();
</script>
</body>
