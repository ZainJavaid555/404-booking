    var rs = localStorage.getItem(LS.sales);
    var rc = localStorage.getItem(LS.cart);
    items = ri ? (JSON.parse(ri) || []) : [];
    sales = rs ? (JSON.parse(rs) || []) : [];
    cart  = rc ? (JSON.parse(rc) || {}) : {};
  }catch(e){ items = []; sales = []; cart = {}; }
  if(!Array.isArray(items)) items = [];
  if(!Array.isArray(sales)) sales = [];
  if(!cart || typeof cart !== "object") cart = {};

  // Strip any image data that older versions wrote into sale lines.
  let trimmed = false;
  sales.forEach(s => (s.lines||[]).forEach(l => {
    if(l.photo){ delete l.photo; trimmed = true; }
    if(l.icon){ delete l.icon; trimmed = true; }
    if(l.tint){ delete l.tint; trimmed = true; }
  }));
  if(sales.length > MAX_SALES){ sales = sales.slice(0, MAX_SALES); trimmed = true; }

  // Seed the real stock ONLY on a device that has never saved anything.
  if(ri === null && !items.length){
    items = FIRST_RUN.map(r => ({id:uid(), name:r[0], photo:"./products/"+r[1]+".png",
                                 cost:0, price:0, stock:r[4], active:true}));
    save();
  } else if(trimmed) save();
}

/* Confirm storage actually works on this device before anyone starts selling. */
function checkStorage(){
  try{
    localStorage.setItem("g404_test","1");
    localStorage.removeItem("g404_test");
    return true;
  }catch(e){ return false; }
}
function queueAdd(kind, payload){
  if(!SYNC_ON()) return;                         // #1 never build a queue with nowhere to send it
  try{
    const q = queueGet();
    q.push({kind, payload, at:Date.now()});
    if(q.length > MAX_QUEUE) q.splice(0, q.length - MAX_QUEUE);
    localStorage.setItem(LS.queue, JSON.stringify(q));
  }catch(e){                                     // #17 do not fail silently
    console.error("QUEUE WRITE FAILED", e);
    toast("Storage full — this change will not reach the database", true);
  }
}
function queueSet(q){
  try{ localStorage.setItem(LS.queue, JSON.stringify(q)); }catch(e){ console.error(e); }
}
function queueGet(){
  try{ return JSON.parse(localStorage.getItem(LS.queue) || "[]"); }catch(e){ return []; }
}
function queueClear(){ try{ localStorage.removeItem(LS.queue); }catch(e){} }


/* ---------- 4. SUPABASE SYNC ---------- */
const SYNC_ON = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const MAX_QUEUE = 500;
let syncStarted = false, initRetried = false, channel = null;

async function initSync(){
  if(syncStarted) return;                       // #18 one channel per session, not per login
  if(!SYNC_ON()){ setNet(false,"Local only"); return; }
  syncStarted = true;
  try{
    console.log("[404] initSync: getting client");
    await ensureClient();
    const { data: sess } = await sb.auth.getSession();
    console.log("[404] initSync: session present?", !!(sess && sess.session));
    setNet(true,"Synced");
    console.log("[404] initSync: flushing queue");
    await flushQueue();                         // #3 send our work BEFORE taking theirs
    console.log("[404] initSync: pulling");
    await pull();
    console.log("[404] initSync: pull done, subscribing");
    subscribeRealtime();
    loadSessions();
  }catch(e){
    console.error("[404] sync init failed:", e);
    syncStarted = false;
    setNet(false, "Offline (init: " + why(e) + ")");
    if(!initRetried){ initRetried = true; setTimeout(()=>initSync(), 1500); }
  }
}
function why(e){
  if(!e) return "unknown";
  const m = e.message || e.error_description || e.msg || String(e);
  return m.length > 60 ? m.slice(0,60) + "…" : m;
}
/* Live updates are a bonus. If the channel cannot be set up the app still
   works, so this must never be able to mark the whole app as offline.
   A channel can only take handlers BEFORE it subscribes, so any previous
   one (from an earlier sign-in) has to be removed first. */
async function subscribeRealtime(){
  if(!sb) return;
  try{
    if(channel){ try{ await sb.removeChannel(channel); }catch(e){} channel = null; }
    channel = sb.channel("g404-" + Date.now())      // a fresh name every time
      .on("postgres_changes",{event:"*",schema:"public",table:"items"},()=>pull(true))
      .on("postgres_changes",{event:"*",schema:"public",table:"sales"},()=>pull(true))
      // Live gaming sessions belong to the other app, but this one shows them.
      .on("postgres_changes",{event:"*",schema:"public",table:"gz_sessions"},()=>loadSessions());
    channel.subscribe(st => {
      console.log("[404] realtime:", st);
      if(st === "SUBSCRIBED"){ rtBackoff = 2000; if(!online) verifyConnection(); return; }
      // A dropped socket used to be logged and forgotten: the dot stayed
      // green while the till had stopped hearing about sessions ended on
      // the other app. Now it says so, and comes back on its own.
      if(st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED"){
        setNet(false, "Reconnecting\u2026");
        scheduleResubscribe();
      }
    });
  }catch(e){
    console.warn("[404] realtime unavailable (app still works):", e);
    scheduleResubscribe();
  }
}
let rtRetry = null, rtBackoff = 2000;
function scheduleResubscribe(){
  if(rtRetry) return;
  rtRetry = setTimeout(()=>{ rtRetry = null; subscribeRealtime(); }, rtBackoff);
  rtBackoff = Math.min(30000, rtBackoff * 2);
}
// Only a state KNOWN to be dead counts as dead; anything else is left alone,
// or a rejoin loop can chase its own tail.
const realtimeAlive = () => !!channel && !["closed","errored","leaving"].includes(channel.state);

/* The countdown has to move, so redraw once a second while the page is open.
   Only the Sessions view is redrawn, and only the numbers change. */
setInterval(() => {
  if(tab === "sessions" && gzSessions.length) render();
}, 1000);
/* And re-read who is playing every half minute, in case a realtime event was
   missed while the phone was asleep. */
setInterval(() => {
  if(document.visibilityState !== "visible") return;
  if(sb && user && !realtimeAlive() && !rtRetry) subscribeRealtime();
  loadSessions();
}, 30000);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") loadSessions();
});

function setNet(ok, label){
  online = ok;
  const d = $("netDot"); if(d) d.className = "dot" + (ok ? "" : " off");
  const h2 = $("hSub"); if(h2) h2.textContent = label;
}

async function pull(quiet){
  if(!sb) return;
  let ok = false;
  if(queueGet().length){ await flushQueue(); }   // #3 never overwrite unsent work
  try{
    const [ri, rs] = await Promise.all([
      sb.from("items").select("*").order("name"),
      sb.from("sales").select("*").gte("created_at", periodStart("today").toISOString())
        .order("created_at",{ascending:false}).limit(500)
    ]);
    if(ri.error) throw ri.error;
    if(rs.error) throw rs.error;
    // #2 an empty or missing table must never wipe a working till
    if(Array.isArray(ri.data) && ri.data.length) items = ri.data;
    else if(Array.isArray(ri.data) && !ri.data.length && items.length){
      // Empty database: an owner uploads the catalogue once. Staff never can.
      if(isOwner()){
        const r = await sb.from("items").upsert(items.map(i => stripItem(i, true)), {onConflict:"id"});
        if(r.error) console.warn("initial upload failed", r.error);
        else toast(items.length + " products uploaded to the database");
      } else {
        console.warn("server items table empty — keeping local catalogue");
      }
    }
    // 500 rows back means the answer may be clipped, so it cannot be treated
    // as the full truth for the window.
    if(Array.isArray(rs.data))
      mergeSales(rs.data, rs.data.length >= 500 ? null : periodStart("today").toISOString());
    save();
    ok = true;
  }catch(e){
    console.error("[404] pull failed:", e);
    setNet(false, "Offline (pull: " + why(e) + ")");
  }
  // Outside the try: a rendering error is not a network error and must not
  // make the header claim we are offline.
  if(ok){ setNet(true,"Synced"); }
  render();
}

/* Sales still sitting in the offline queue. These have not reached the
   database yet, so the database's silence about them means nothing. */
function pendingSaleIds(){
  const s = new Set();
  try{ queueGet().forEach(j => {
    if(!j.payload) return;
    if(j.kind === "sale" && j.payload.id) s.add(j.payload.id);
    // A snack put on a session tab is queued as "tabAdd", which carries a
    // session id and no row id — so it used to protect nothing. The local row
    // it created ("tab_<session>") then looked unknown to mergeSales and was
    // deleted off the phone, staff re-added the items, and when the queue
    // finally drained the customer was charged twice.
    if(j.kind === "tabAdd" && j.payload.session) s.add("tab_" + j.payload.session);
  }); }
  catch(e){}
  return s;
}

/* The database is the record; this device only mirrors it.
   Inside the window we just downloaded, the server's answer is the whole
   truth — a sale it did not return no longer exists and is dropped here too.
   Outside that window we were told nothing, so we keep what we hold.
   Sales still queued for upload are never dropped: they are ours, not the
   server's, until they land. Pass fromISO = null to only add and never
   remove (used when a fetch came back truncated and so is not the truth). */
function mergeSales(rows, fromISO){
  const byId   = new Map();
  const pending = pendingSaleIds();
  const from   = fromISO ? new Date(fromISO).getTime() : null;

  sales.forEach(s => {
    const t = new Date(s.created_at).getTime();
    const authoritativeHere = from !== null && t >= from;
    if(!authoritativeHere || pending.has(s.id)) byId.set(s.id, s);
  });
  rows.forEach(r => byId.set(r.id, r));          // server wins on conflict
  sales = [...byId.values()]
    .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at))
    .slice(0, MAX_SALES);
}

/* History is only downloaded when a report period asks for it. */
const FETCH_CAP = 5000;
let fetched = {};        // period -> time it was last loaded
let loadingPeriod = false;
let periodTruncated = false;

async function fetchPeriod(p, force){
  if(!sb || !online) return;
  if(p === "today") return;                       // the routine sync already has it
  if(loadingPeriod) return;                       // one at a time
  const last = fetched[p] || 0;
  if(!force && Date.now() - last < 60000) return; // do not refetch on every tap
  // Claim it BEFORE rendering. render() calls back into this function, so
  // without this the two would call each other forever.
  fetched[p] = Date.now();
  loadingPeriod = true; render();
  try{
    let q = sb.from("sales").select("*").order("created_at",{ascending:false}).limit(FETCH_CAP);
    if(p !== "all") q = q.gte("created_at", periodStart(p).toISOString());
    const { data, error } = await q;
    if(error) throw error;
    periodTruncated = Array.isArray(data) && data.length >= FETCH_CAP;
    if(Array.isArray(data)){
      const from = periodTruncated ? null
                 : (p === "all" ? new Date(0).toISOString() : periodStart(p).toISOString());
      mergeSales(data, from);
    }
  }catch(e){
    console.warn("period fetch failed", e);
    toast("Could not load older sales — showing what is on this device", true);
  }finally{
    loadingPeriod = false; render();
  }
}

/* Stock moves as a DELTA so two phones selling at once cannot overwrite
   each other. Applied server-side by the adjust_stock function. */
async function pushStock(id, delta){
  if(!delta) return;
  return push("stock", {id, delta});
}

async function push(kind, payload){
  if(!SYNC_ON()) return true;                    // #1 nothing to queue when sync is off
  if(!sb){ queueAdd(kind, payload); return false; }
  // Do not refuse to try just because the flag says offline — the flag can be wrong.
  try{
    if(kind === "sale"){
      let r = await sb.from("sales").upsert(payload, {onConflict:"id"});  // #19 idempotent
      // If the app reaches the shop before the late-entry migration has been
      // run, the database has no backdated/entered_at columns. Selling must
      // not stop for that. Drop the two new fields and send the sale anyway —
      // the money is what matters; the label can wait for the migration.
      // Same for the split-payment columns. A sale must never fail to save
      // because a migration has not been run — the money is what matters, and
      // pay_method still carries the whole-bill cases on its own.
      if(r.error && /backdated|entered_at|cash_amount|online_amount|does not exist|schema cache/i.test(r.error.message || "")){
        const {backdated, entered_at, ...older} = payload;
        console.warn("optional columns missing — sending the sale without them");
        r = await sb.from("sales").upsert(older, {onConflict:"id"});
        if(r.error && /cash_amount|online_amount|does not exist|schema cache/i.test(r.error.message || "")){
          const {cash_amount, online_amount, ...oldest} = older;
          r = await sb.from("sales").upsert(oldest, {onConflict:"id"});
        }
      }
      if(r.error) throw r.error;
    }
    if(kind === "tabAdd"){
      // Merged server-side, so two phones adding to the same tab at once
      // cannot overwrite each other's items.
      const r = await sb.rpc("gz_add_to_tab", {
        p_session_id: payload.session, p_lines: payload.lines, p_staff: payload.staff });
      if(r.error) throw r.error;
    }
    if(kind === "void"){
      const r = await sb.from("sales").update({voided:true, void_reason:payload.reason,
        voided_by:payload.by, voided_at:payload.at}).eq("id",payload.id);
      if(r.error) throw r.error;
    }
    if(kind === "stock"){
      const r = await sb.rpc("adjust_stock", {p_id:payload.id, p_delta:payload.delta});
      if(r.error) throw r.error;
    }
    if(kind === "itemUpsert"){
      const r = await sb.from("items").upsert(payload, {onConflict:"id"});
      if(r.error) throw r.error;
    }
    if(kind === "itemDelete"){
      const r = await sb.from("items").delete().eq("id",payload.id);
      if(r.error) throw r.error;
    }
    if(!online) setNet(true,"Synced");   // proof we are connected
    return true;
  }catch(e){
    console.error("[404] push failed:", kind, e);
    queueAdd(kind, payload);
    setNet(false, "Offline (push " + kind + ": " + why(e) + ")");
    return false;
  }
}

/* #4 drain one at a time and only drop what actually landed. */
let flushing = false;
async function flushQueue(){
  if(!sb) return;
  // A single sale on another phone fires several realtime events, and each one
  // calls pull() -> flushQueue(). Without this guard two flushes read the same
  // job and both send it. "sale" is an upsert so a repeat is harmless, but
  // "tabAdd" and "stock" are server-side ADDITIONS — sending either twice
  // double-charges a customer's tab and takes the stock off twice.
  if(flushing) return;
  flushing = true;
  try{
    let sent = 0;
    while(true){
      // Re-read every time. Holding one captured array and writing it back
      // after each job overwrote anything queued during the await — a sale
      // rung up mid-flush was dropped from the queue and, having never
      // reached the server, was then deleted from the local list too.
      const q = queueGet();
      if(!q.length) break;
      const job = q[0];
    let ok = false;
    try{
      if(job.kind === "sale"){ const r = await sb.from("sales").upsert(job.payload,{onConflict:"id"}); ok = !r.error; }
      else if(job.kind === "tabAdd"){ const r = await sb.rpc("gz_add_to_tab",{p_session_id:job.payload.session, p_lines:job.payload.lines, p_staff:job.payload.staff}); ok = !r.error; }
      else if(job.kind === "void"){ const r = await sb.from("sales").update({voided:true, void_reason:job.payload.reason, voided_by:job.payload.by, voided_at:job.payload.at}).eq("id",job.payload.id); ok = !r.error; }
      else if(job.kind === "stock"){ const r = await sb.rpc("adjust_stock",{p_id:job.payload.id, p_delta:job.payload.delta}); ok = !r.error; }
      else if(job.kind === "itemUpsert"){ const r = await sb.from("items").upsert(job.payload,{onConflict:"id"}); ok = !r.error; }
      else if(job.kind === "itemDelete"){ const r = await sb.from("items").delete().eq("id",job.payload.id); ok = !r.error; }
      else ok = true;                            // unknown kind: drop it rather than wedge the queue
    }catch(e){ ok = false; }
      if(!ok){ setNet(false, "Offline (queue: " + job.kind + " rejected)"); break; }
      // Re-read again before removing, so anything queued during the await
      // above survives. Only this one job is dropped, by identity.
      const fresh = queueGet();
      const at = fresh.findIndex(j => j === job || (j.kind === job.kind && JSON.stringify(j) === JSON.stringify(job)));
      if(at >= 0) fresh.splice(at, 1); else fresh.shift();
      queueSet(fresh); sent++;                   // persist progress after every single write
    }
    if(sent) toast(sent + " offline change" + (sent>1?"s":"") + " synced");
  } finally {
    flushing = false;
  }
}

/* ---------- 5. LOGIN ----------
   With Supabase configured, identity and permissions come from real accounts and
   the database enforces them. Without it, the PIN pad is used for local testing. */
let pin = "";
const AUTH_ON = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);

function buildKeys(){
  const k = $("keys"); if(!k) return; k.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(v=>{
    const b = document.createElement("button");
    b.textContent = v;
    if(v === "OK") b.className = "wide";
    b.onclick = ()=>{
      Sound.unlock(); Sound.tap();
      if(v === "⌫") pin = pin.slice(0,-1);
      else if(v === "OK") return tryLogin();
      else if(pin.length < 6) pin += v;
      $("pinBox").textContent = "•".repeat(pin.length);
      $("loginMsg").textContent = "";
    };
    k.appendChild(b);
  });
}

/* Local-only mode: PIN pad. */
function tryLogin(){
  const hit = CONFIG.USERS.find(u => u.pin === pin);
  if(hit){ startApp(hit.role, hit); return; }
  $("loginMsg").textContent = "Wrong PIN"; pin = ""; $("pinBox").textContent = "";
}

/* Real mode: Supabase email + password. */
async function signIn(){
  const email = ($("authEmail").value||"").trim();
  const pass  = $("authPass").value||"";
  if(!email || !pass){ $("loginMsg").textContent = "Enter your email and password"; return; }
  const btn = $("authGo"); btn.disabled = true; btn.textContent = "Signing in…";
  $("loginMsg").textContent = "";
  try{
    await ensureClient();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error) throw error;
    const who = await loadProfile(data.user);
    if(!who){ $("loginMsg").textContent = "No profile set up for this account. Ask Zain."; return; }
    $("authPass").value = "";
    syncStarted = false; initRetried = false;   // new session, so let sync start fresh
    startApp(who.role, who);
  }catch(e){
    console.warn("sign in failed", e);
    $("loginMsg").textContent = (e && e.message) ? e.message : "Could not sign in";
  }finally{
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

/* Role comes from the profiles table, never from the client. */
async function loadProfile(authUser){
  if(!authUser) return null;
  try{
    const { data, error } = await sb.from("profiles").select("name,role").eq("id", authUser.id).single();
    if(error) throw error;
    const who = { id:authUser.id, name:data.name, role:data.role, email:authUser.email };
    try{ localStorage.setItem(LS.profile, JSON.stringify(who)); }catch(e){}
    return who;
  }catch(e){
    // Offline: fall back to the profile cached at last successful sign-in.
    try{
      const c = JSON.parse(localStorage.getItem(LS.profile) || "null");
      if(c && c.id === authUser.id) return c;
    }catch(e2){}
    return null;
  }
}

let clientPromise = null;
/* Sign-in and session-restore can both ask for the client at the same moment.
   Without sharing one promise they each build their own, and only one of them
   ends up holding the session — which then looks like being offline. */
function ensureClient(){
  if(sb) return Promise.resolve(sb);
  if(clientPromise) return clientPromise;
  clientPromise = (async ()=>{
    if(!window.supabase){
      await new Promise((res, rej)=>{
        const existing = document.getElementById("sbLib");
        if(existing){ existing.addEventListener("load", res); existing.addEventListener("error", rej); return; }
        const s = document.createElement("script");
        s.id = "sbLib";
        s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
      auth:{ persistSession:true, autoRefreshToken:true, storageKey:'gz_auth' }   // one sign-in for the whole site
    });
    return sb;
  })();
  clientPromise.catch(()=>{ clientPromise = null; });   // allow a retry
  return clientPromise;
}

/* Already signed in on this device? Go straight in — including offline. */
async function restoreSession(){
  if(!AUTH_ON()) return false;
  try{
    await ensureClient();
    const { data } = await sb.auth.getSession();
    if(data && data.session && data.session.user){
      const who = await loadProfile(data.session.user);
      if(who){ startApp(who.role, who); return true; }
    }
  }catch(e){ console.warn("session restore failed", e); }
  return false;
}

function showLogin(){
  const emailMode = AUTH_ON();
  $("pinWrap").classList.toggle("hidden", emailMode);
  $("emailForm").classList.toggle("hidden", !emailMode);
  $("authNote").classList.toggle("hidden", !emailMode);
}

function startApp(r, who){
  Sound.unlock(); Sound.welcome();
  role = r; user = who || null; pin = "";
  userName = (who && who.name || "").trim() || null;   // "Zain", "Arslan", "Staff"
  const pb = $("pinBox"); if(pb) pb.textContent = "";
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("roleBadge").textContent = isOwner() ? "OWNER" : "STAFF";
  $("roleBadge").className = "badge " + (isOwner() ? "owner" : "staff");
  tab = "sell";
  buildNav(); render(); initSync();
}

async function logout(){
  save();            // never leave a basket behind for the next person
  if(AUTH_ON() && sb){
    try{ await sb.auth.signOut(); }catch(e){}
    try{ localStorage.removeItem(LS.profile); }catch(e){}
  }
  if(channel && sb){ try{ await sb.removeChannel(channel); }catch(e){} channel = null; }
  role = null; user = null; cart = {};
  syncStarted = false; initRetried = false;
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  showLogin();
}

/* Which gaming session a past snack sale belonged to, so the report can say
   who bought it. Live sessions and finished ones both count. */
let sessionInfo = {};      // session id -> { platform, names }

async function loadSessionInfo(ids){
  if(!sb || !online || !ids.length) return;
  const missing = ids.filter(id => id && !sessionInfo[id]);
  if(!missing.length) return;
  try{
    const [{data:live}, {data:done}] = await Promise.all([
      sb.from("gz_sessions").select("id,platform,players").in("id", missing),
      sb.from("gz_history").select("id,platform,player_names").in("id", missing)
    ]);
    (live || []).forEach(x => {
      sessionInfo[x.id] = {
        platform: (x.platform || "").toUpperCase(),
        names: (x.players || []).map(p => p && p.name).filter(Boolean).join(", ")
      };
    });
    (done || []).forEach(x => {
      sessionInfo[x.id] = {
        platform: (x.platform || "").toUpperCase(),
        names: (x.player_names || []).filter(Boolean).join(", ")
      };
    });
    render();
  }catch(e){ console.warn("[404] session names unavailable:", e); }
}

/* ---------- LIVE GAMING SESSIONS ----------
   Read straight from the gaming zone's own table. Attaching a snack to the
   session the customer is sitting at removes the "who bought what" guesswork
   that was causing missed entries. */
async function loadSessions(){
  if(!sb || !online) return;
  try{
    const [{data:ses, error:e1}, {data:tabs, error:e2}] = await Promise.all([
      sb.from("gz_sessions").select("*").order("start_time"),
      sb.rpc("gz_session_tabs")
    ]);
    if(e1) throw e1;
    if(e2) throw e2;
    gzSessions = ses || [];
    gzTabs = {};
    (tabs || []).forEach(t => { gzTabs[t.session_id] = { items: Number(t.items)||0, amount: Number(t.amount)||0 }; });
    if(tab === "sessions") render();
  }catch(e){ console.warn("[404] could not read sessions:", e); }
}

function sessionLabel(x){
  const names = (x.players || []).map(p => p && p.name).filter(Boolean);
  return names.join(", ") || "\u2014";
}
function remainingText(x){
  const ms = Number(x.end_time) - Date.now();
  if(ms <= 0) return "time up";
  const m = Math.floor(ms/60000), sec = Math.floor((ms%60000)/1000);
  return pad2(m) + ":" + pad2(sec) + " left";
}

function viewSessions(){
  if(!gzSessions.length){
    return `<div class="empty"><span class="e">\u{1F3AE}</span>No one is playing right now.<br>
      <span style="font-size:12px">Start a session on the gaming zone page and it will appear here.</span></div>`;
  }
  return `<div class="sesswrap">` + gzSessions.map(x => {
    const t = gzTabs[x.id] || { items:0, amount:0 };
    const over = Number(x.end_time) - Date.now() <= 0;
    return `<button class="sesscard ${over?"over":""}" data-sess="${esc(x.id)}">
      <div class="sctop">
        <span class="plat ${esc(x.platform||"ps5")}">${esc((x.platform||"ps5").toUpperCase())}</span>
        <span class="sctime ${over?"up":""}">${remainingText(x)}</span>
      </div>
      <div class="scname">${esc(sessionLabel(x))}</div>
      <div class="scfoot">
        ${t.items
          ? `<span class="sctab">${t.items} snack${t.items>1?"s":""} \u00b7 ${money(t.amount)}</span>`
          : `<span class="sctab none">no snacks yet</span>`}
        <span class="scadd">${t.items ? "View" : "Add"} \u203A</span>
      </div>
    </button>`;
  }).join("") + `</div>
  <div class="hintbar">Snacks added here are put on the session's tab and paid for when the session ends on the gaming page.</div>`;
}

/* Tapping a session opens its tab: what they have had, adjustable there and
   then, with a way through to add more. Correcting a mistake at the counter
   takes seconds; leaving it for the owner to unpick later does not. */
function openSessionSheet(sessionId){
  const x = gzSessions.find(g => g.id === sessionId);
  if(!x) return;
  const who = sessionLabel(x);
  const plat = (x.platform || "ps5").toUpperCase();
  const row = sales.find(r => r.id === "tab_" + sessionId && !r.voided && !r.settled_at);
  let draft = ((row && row.lines) || []).map(l => ({...l}));
  const original = JSON.stringify(draft);

  const goSell = () => {
    tabFor = { id:sessionId, label:who, platform:plat };
    cart = {}; save();
    closeSheet(); Sound.nav(); tab = "sell"; buildNav(); render();
  };

  const body = () => {
    const total = draft.reduce((n,l)=>n + rupees(l.price)*l.qty, 0);
    const dirty = JSON.stringify(draft) !== original;
    return `<h2 style="margin-bottom:2px">${esc(who)}</h2>
      <p style="color:var(--dim);font-size:12px;margin:0 0 12px">${esc(plat)} \u00b7 ${esc(remainingText(x))}</p>

      ${draft.length ? `<div id="tlines">${draft.map((l,i)=>`
        <div class="tline">
          <div class="tl-name">${esc(l.name)}<i>${money(l.price)} each</i></div>
          <button class="tl-btn" data-tdec="${i}">\u2212</button>
          <span class="tl-q">${l.qty}</span>
          <button class="tl-btn" data-tinc="${i}">+</button>
          <span class="tl-amt">${money(rupees(l.price)*l.qty)}</span>
        </div>`).join("")}</div>
        <div class="tl-total"><span>Tab total</span><b>${money(total)}</b></div>`
      : `<div class="tl-none">Nothing on this tab yet.</div>`}

      ${(!draft.length && row) ? `<p style="color:var(--warn);font-size:12.5px;margin-top:8px">Saving with nothing left will void this tab.</p>` : ""}

      <div class="mrow" style="margin-top:14px">
        <button class="btn gh" data-x>Close</button>
        ${dirty ? `<button class="btn rd" id="tok">Save changes</button>` : ""}
        <button class="btn pri" id="tadd">Add Snacks \u203A</button>
      </div>`;
  };

  const saveDraft = async () => {
    if(!sb || !online){ toast("Correcting a tab needs a connection", true); return false; }
    const { data, error } = await sb.rpc("gz_set_tab_lines", {
      p_session_id: sessionId, p_lines: draft, p_by: currentUser() });
    if(error){ toast("Could not save: " + (error.message || "error"), true); return false; }
    if(data && data.emptied){
      if(row){ row.voided = true; row.void_reason = "All items removed"; row.voided_by = currentUser(); }
    }else if(row){
      row.lines = draft;
      row.total = draft.reduce((n,l)=>n + rupees(l.price)*l.qty, 0);
      row.cost_total = draft.reduce((n,l)=>n + rupees(l.cost)*l.qty, 0);
      row.profit = row.total - row.cost_total;
    }
    save(); loadSessions();
    return true;
  };

  const wire = () => {
    document.querySelectorAll("[data-tinc]").forEach(b => b.onclick = ()=>{
      draft[+b.dataset.tinc].qty += 1; redraw();
    });
    document.querySelectorAll("[data-tdec]").forEach(b => b.onclick = ()=>{
      const i = +b.dataset.tdec;
      draft[i].qty -= 1;
      if(draft[i].qty <= 0) draft.splice(i,1);
      redraw();
    });
    const ok = $("tok");
    if(ok) ok.onclick = async ()=>{
      ok.disabled = true; ok.textContent = "Saving\u2026";
      if(await saveDraft()){ closeSheet(); render(); toast("Tab updated \u00b7 stock adjusted"); }
      else { ok.disabled = false; ok.textContent = "Save changes"; }
    };
    const add = $("tadd");
    if(add) add.onclick = async ()=>{
      // Unsaved corrections are kept, not quietly dropped, before moving on.
      if(JSON.stringify(draft) !== original){
        add.disabled = true; add.textContent = "Saving\u2026";
        if(!(await saveDraft())){ add.disabled = false; add.textContent = "Add Snacks \u203A"; return; }
      }
      goSell();
    };
  };
  const redraw = ()=>{
    const sh = document.querySelector("#sheet .sheet");
    if(!sh) return;
    sh.innerHTML = body();
    sh.querySelectorAll("[data-x]").forEach(b => b.onclick = closeSheet);
    wire();
  };

  openSheet(body(), wire);
}

/* ---------- 6. NAV ---------- */
function buildNav(){
  const tabs = isOwner()
    ? [["sessions","🎮","Sessions"],["sell","🛒","Sell"],["stock","📦","Stock"],["history","🕘","History"],["items","⚙️","Items"],["report","📊","Reports"]]
    : [["sessions","🎮","Sessions"],["sell","🛒","Sell"],["stock","📦","Stock"],["today","🧾","Today"]];
  $("nav").innerHTML = tabs.map(([k,i,l])=>
    `<button data-tab="${k}" class="${tab===k?"on":""}"><span class="ic">${i}</span>${l}</button>`
  ).join("");
  $("nav").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      Sound.nav();
      if(b.dataset.tab !== "sell"){
        // Only let go of the session while the basket is empty. Dropping
        // tabFor with items still in the basket turned the customer's tab
        // into a counter sale the moment staff glanced at Stock and came
        // back: the banner was gone, checkout asked for cash, and the snacks
        // never reached the tab that gets settled at the end of the session.
        if(!Object.keys(cart).length) tabFor = null;
        saleMode = "now";                           // and never come back to a page still armed for backdating
        lateDate = ""; lateTime = "";
      }
      tab = b.dataset.tab; buildNav(); render();
      if(tab === "sessions") loadSessions();
      // Deliveries and counts are owner-only and only needed on this page, so
      // a counter phone never downloads them.
      // Deliveries are owner-only and only needed on these two pages, so a
      // counter phone never downloads them.
      if((tab === "stock" || tab === "report" || tab === "history") && isOwner()){
        // History needs the WHOLE log: "stock on a date" walks back through
        // every movement since that date, and the earliest date offered is
        // the first movement ever recorded.
        ensureStockLog(tab === "history" ? "all" : tab === "report" ? period : "month").then(did => { if(did) render(); });
      }
    };
  });
}

/* ---------- 7. RENDER ---------- */
function render(){
  const m = $("main");
  $("cartBar").classList.toggle("hidden", tab !== "sell");
  if(tab === "sessions") m.innerHTML = viewSessions();
  if(tab === "sell")   m.innerHTML = viewSell();
  if(tab === "stock")  m.innerHTML = viewStock();
  if(tab === "items")  m.innerHTML = viewItems();
  if(tab === "history"){ m.innerHTML = viewHistory(); if(histView === "onDate") fetchPeriod("all"); }
  if(tab === "report"){ m.innerHTML = viewReport(); fetchPeriod(period); }
  if(tab === "today")  m.innerHTML = viewToday();
  wire();
  updateCartBar();
}

/* ----- SELL ----- */
/* "now" is an ordinary sale. "late" records one that was served but never
   rung up \u2014 the date and time are chosen, the stock still moves today. */
let saleMode = "now";
let lateDate = "";          // yyyy-mm-dd
let lateTime = "";          // HH:MM

/* The chosen moment, or null if it is not filled in yet. */
function lateStamp(){
  if(!lateDate || !lateTime) return null;
  const [y,m,d]  = lateDate.split("-").map(Number);
  const [hh,mm]  = lateTime.split(":").map(Number);
  if(!y || !m || !d || isNaN(hh) || isNaN(mm)) return null;
  const t = new Date(y, m-1, d, hh, mm, 0, 0);
  return isNaN(t.getTime()) ? null : t;
}

/* Why a late entry can or cannot be saved. Returns "" when it is fine.
   Staff may only reach back into tonight; owners may pick any past date. */
function lateProblem(){
  const t = lateStamp();
  if(!t) return "Pick the date and time the customer was served.";
  if(t.getTime() > Date.now() + 60000) return "That is in the future. Pick a time that has already happened.";
  if(!isOwner() && dayOf(t.toISOString()) !== todayKey())
    return "You can only add a sale missed during tonight's shift. Ask an owner for an earlier date.";
  if(t.getTime() < Date.now() - 7*86400000) return "That is more than a week ago.";
  return "";
}

function viewSell(){
  const live = items.filter(i => i.active !== false);
  const banner = tabFor ? `<div class="tabbar">
      <button class="tabback" id="tabBack">\u2039</button>
      <div class="tabwho">
        <b>${esc(tabFor.label)}</b>
        <i>${esc(tabFor.platform)} \u00b7 goes on their tab, paid when the session ends</i>
      </div>
    </div>` : "";

  // A session tab is by definition happening now, so backdating has no
  // meaning there and the strip is hidden while one is open.
  const modes = tabFor ? "" : `<div class="modeseg" id="modeSeg">
      <button data-mode="now"  class="${saleMode==="now" ?"on":""}">\u{1F6D2} Sell Now</button>
      <button data-mode="late" class="${saleMode==="late"?"on":""}">\u{1F4DD} Late Entry</button>
    </div>`;

  let panel = "";
  if(!tabFor && saleMode === "late"){
    panel = `<div class="latebox">
      <div class="lrow">
        <div class="lf"><label>Date served</label>
          <input type="date" id="lateDate" value="${esc(lateDate)}" max="${esc(ymdLocal(new Date()))}"></div>
        <div class="lf"><label>Time served</label>
          <input type="time" id="lateTime" value="${esc(lateTime)}"></div>
      </div>
      <div class="latehint" id="lateHint"></div>
      <div class="latehint">Stock comes off now, because that is when the shelf is actually short.${isOwner()?"":" Staff can reach back to the start of tonight only."}</div>
    </div>`;
  }
  const head = banner + modes + panel;

  if(!live.length) return head + `<div class="empty"><span class="e">\u{1F4E6}</span>No items yet.${isOwner()?" Add some in the Items tab.":" Ask the owner to add items."}</div>`;
  return head + `<div class="grid">` + live.map(i=>{
    const q = cart[i.id] || 0;
    const noPrice = !(i.price > 0);
    const out = noPrice || i.stock <= 0;
    const low = !noPrice && i.stock > 0 && i.stock <= CONFIG.LOW_STOCK;
    return `<div class="item ${out?"dis":""} ${q?"inCart":""}" data-card="${esc(i.id)}">
      ${q?`<span class="qbadge">${q}</span>`:""}
      ${itemVisual(i,"ico")}
      <div class="nm">${esc(i.name)}</div>
      <div class="pr">${noPrice?"—":money(i.price)}</div>
      <div class="st ${out?"out":low?"low":""}">${noPrice?"Set price":i.stock<=0?"Out of stock":i.stock+" left"}</div>
      <div class="qrow">
        <button class="qb minus" data-dec="${i.id}" ${q?"":"disabled"} aria-label="Remove one">\u2212</button>
        <span class="qn">${q}</span>
        <button class="qb plus" data-inc="${i.id}" ${(out||q>=i.stock)?"disabled":""} aria-label="Add one">+</button>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

/* ----- STOCK ----- */
function viewStock(){
  if(!items.length) return `<div class="empty"><span class="e">📦</span>No items yet.${isOwner()?"<br>Go to the Items tab and add your first product.":"<br>Ask the owner to add items."}</div>`;
  const sorted = [...items].sort((a,b)=>a.stock-b.stock);
  const lows = sorted.filter(i=>i.stock <= CONFIG.LOW_STOCK);
  const lowBanner = lows.length
    ? `<div class="banner"><b>⚠️ ${lows.length} item${lows.length>1?"s":""} running low</b><br>${lows.map(i=>esc(i.name)+" ("+i.stock+")").join(", ")}</div>` : "";

  // Staff see exactly what they always saw: the count, and nothing about money.
  if(!isOwner()){
    return lowBanner + `<div class="card"><h3>Current Stock</h3>` + sorted.map(i=>`
      <div class="line">
        ${itemVisual(i,"ico")}
        <div class="mid"><div class="t1">${esc(i.name)}</div>
        <div class="t2">Sells at ${money(i.price)}</div></div>
        <div class="amt" style="color:${i.stock<=0?"var(--bad)":i.stock<=CONFIG.LOW_STOCK?"var(--warn)":"var(--okl)"}">${i.stock}</div>
      </div>`).join("") + `</div>`;
  }

  const monthFrom = periodStart("month").getTime();
  const spent = spentIn(monthFrom);
  const dels  = deliveries();

  const head = `<div class="card"><h3>Money in stock</h3>
    <div class="stat"><span class="k">On the shelves, at cost</span><span class="v">${money(shelfValue())}</span></div>
    <div class="stat"><span class="k">Spent on stock this month</span><span class="v">${money(spent)}</span></div>
    <div class="stat"><span class="k">Deliveries this month</span><span class="v">${dels.filter(r=>new Date(r.at).getTime()>=monthFrom).length}</span></div>
  </div>`;

  const list = `<div class="card"><h3>Current Stock</h3>` + sorted.map(i=>{
    const last = lastDelivery(i.id);
    return `<div class="line" data-stockitem="${esc(i.id)}" style="cursor:pointer">
      ${itemVisual(i,"ico")}
      <div class="mid">
        <div class="t1">${esc(i.name)}</div>
        <div class="t2">Worth ${money(Math.max(0,whole(i.stock))*rupees(i.cost))} at cost${
          last ? " · last in " + new Date(last.at).toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) : " · no delivery recorded"}</div>
      </div>
      <div class="amt" style="color:${i.stock<=0?"var(--bad)":i.stock<=CONFIG.LOW_STOCK?"var(--warn)":"var(--okl)"}">${i.stock}</div>
      <button class="iconbtn" data-restock="${esc(i.id)}" title="Stock arrived">+</button>
    </div>`;
  }).join("") + `</div>`;

  const recent = dels.slice(0, 30);
  const stockIn = `<div class="card"><h3>Stock In</h3>` + (recent.length
    ? recent.map(r=>{
        const it = items.find(x=>x.id===r.item_id);
        const priced = r.unit_cost != null;
        return `<div class="dsale" data-stockitem="${esc(r.item_id)}" style="cursor:pointer">
          <span class="dsw-time">${new Date(r.at).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</span>
          <span class="dsw-what">${esc(it ? it.name : r.item_id)} · ${whole(r.delta)} × ${
            priced ? money(r.unit_cost) : "price not recorded"}</span>
          <span class="dsw-amt">${priced ? money(whole(r.delta)*rupees(r.unit_cost)) : "\u2014"}</span>
        </div>`;
      }).join("")
    : `<div class="empty" style="padding:18px 0"><span class="e">🧾</span>No deliveries recorded yet.<br>Tap <b>+</b> on an item when stock arrives.</div>`)
    + `</div>`;

  return lowBanner + head + list + stockIn;
}

/* Everything known about one item: what is there, what it is worth, when it
   last came in, and what has been made on it since that delivery. */
async function stockItemSheet(id){
  const it = items.find(x=>x.id===id); if(!it) return;
  const lots = deliveries().filter(r=>r.item_id===id);   // newest first

  openSheet(`<h2>${esc(it.name)}</h2>
    <div id="siBody" style="font-size:13.5px;color:var(--dim)">Working it out…</div>
    <div class="mrow" style="margin-top:12px">
      <button class="btn gh" data-x>Close</button>
      <button class="btn gh" id="siCount">Count shelf</button>
      <button class="btn pri" id="siAdd">Stock arrived</button>
    </div>`,
  async ()=>{
    $("siAdd").onclick   = ()=>{ closeSheet(); restockModal(id); };
    $("siCount").onclick = ()=>{ closeSheet(); countModal(id); };

    /* Every delivery of this item, and what was earned while it was on the
       shelf. A lot's window runs from the day it arrived until the next
       delivery replaced it — so "profit on that stock" means the profit taken
       between the two, which is the only reading the till can actually
       support: individual cans are not tracked, only quantities.

       Sales are asked for straight from the database. The report period may
       not reach back far enough, and a delivery three months ago has to be
       answerable today. */
    let byLot = null;
    try{
      if(sb && online && lots.length){
        const from = new Date(lots[lots.length-1].at).getTime();
        const r = await sb.from("sales").select("lines,voided,created_at")
          .gte("created_at", new Date(from).toISOString()).limit(5000);
        if(r.error) throw r.error;
        byLot = lots.map(()=>({sold:0, took:0, made:0}));
        (r.data||[]).filter(x=>!x.voided).forEach(x=>{
          const t = new Date(x.created_at).getTime();
          // lots are newest first, so the first one at or before this sale
          // is the delivery the customer was buying out of.
          const k = lots.findIndex(L => new Date(L.at).getTime() <= t);
          if(k < 0) return;
          (x.lines||[]).forEach(l=>{
            if(l.id !== id) return;
            const q = whole(l.qty);
            byLot[k].sold += q;
            byLot[k].took += q*rupees(l.price);
            byLot[k].made += q*(rupees(l.price)-rupees(l.cost));
          });
        });
      }
    }catch(e){ byLot = null; }

    const body = $("siBody"); if(!body) return;

    const head = [
      ["On the shelf now", it.stock + " · " + money(Math.max(0,whole(it.stock))*rupees(it.cost)) + " at cost"],
      ["Sells at", money(it.price) + " · margin " + money(rupees(it.price)-rupees(it.cost))]
    ].map(([k,v])=>`<div class="stat"><span class="k">${k}</span><span class="v" style="font-size:13px">${v}</span></div>`).join("");

    let hist;
    if(!lots.length){
      hist = `<div class="lothint">No deliveries recorded for this item yet.<br>
              Tap <b>Stock arrived</b> when the next lot comes in — from then on
              every delivery is dated and priced, and the profit made against it
              is worked out for you.</div>`;
    } else if(!byLot){
      hist = `<div class="lothint">The delivery history needs a connection to work out. Try again when you are back online.</div>`;
    } else {
      hist = lots.map((L,k)=>{
        const qty   = whole(L.delta);
        const paid  = L.unit_cost == null ? null : rupees(L.unit_cost);
        const spend = paid == null ? null : qty*paid;
        const b     = byLot[k];
        const until = k === 0 ? "still selling" :
          "until " + new Date(lots[k-1].at).toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
        const left  = qty - b.sold;
        return `<div class="lot">
          <div class="lot-h">
            <span class="lot-d">${new Date(L.at).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</span>
            <span class="lot-q">${qty} × ${paid == null ? "price not recorded" : money(paid)}</span>
            <span class="lot-c">${spend == null ? "—" : money(spend)}</span>
          </div>
          <div class="lot-b">
            <div><span class="lk">Sold</span><span class="lv">${b.sold}${left > 0 && k === 0 ? " · " + left + " left" : ""}</span></div>
            <div><span class="lk">Took</span><span class="lv">${money(b.took)}</span></div>
            <div><span class="lk">Profit</span><span class="lv ${b.made>0?"good":""}">${money(b.made)}</span></div>
          </div>
          <div class="lot-f">${until}${left < 0 ? " · sold more than this lot, earlier stock included" : ""}</div>
        </div>`;
      }).join("");

      const totSpend = lots.reduce((a,L)=> a + (L.unit_cost==null ? 0 : whole(L.delta)*rupees(L.unit_cost)), 0);
      const totMade  = byLot.reduce((a,b)=>a+b.made, 0);
      hist += `<div class="stat" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
        <span class="k">All ${lots.length} deliver${lots.length===1?"y":"ies"}</span>
        <span class="v" style="font-size:13px">spent ${money(totSpend)} · made ${money(totMade)}</span></div>`;
    }

    body.innerHTML = head
      + `<div class="lot-title">Deliveries, and what each one earned</div>` + hist;
  });
}

/* ----- TODAY (staff) ----- */
function viewToday(){
  const t = sales.filter(s => dayOf(s.created_at) === todayKey());
  const good = t.filter(s => !s.voided);
  const rev = good.reduce((a,s)=>a+s.total,0);
  return `<div class="card"><h3>Today</h3>
      <div style="text-align:center;padding:8px 0"><div class="big">${money(rev)}</div>
      <div style="color:var(--dim);font-size:12px;margin-top:4px">${good.length} sale${good.length!==1?"s":""}</div></div></div>`
    + salesList(t, true);
}

/* ----- HISTORY (owner) -----
   Two questions about the shelves that the live figure cannot answer:
     - what came in, when, and what it cost        (Stock Added)
     - what was on the shelves on a given day       (Stock on a date)
   Nothing here is stored. Both are worked out from the movement log every
   time, so a correction anywhere is reflected here at once. */
let histView = "added";                    // "added" | "onDate"
let histDate = "";                         // YYYY-MM-DD, a business day

function viewHistory(){
  if(!isOwner()) return `<div class="empty"><span class="e">\u{1F512}</span>Owners only.</div>`;
  const seg = `<div class="seg" id="histSeg">
      <button data-hv="added"  class="${histView==="added" ?"on":""}">Stock Added</button>
      <button data-hv="onDate" class="${histView==="onDate"?"on":""}">Stock on a date</button>
    </div>`;
  return seg + (histView === "onDate" ? stockOnDateHTML() : stockInHTML());
}

/* When the movement log began. Before this instant, movements were not
   written down — but the SALES were, and a sale is a movement. So for the
   days before the log, the sales table stands in for it. */
function logStartMs(){
  // Deliveries recorded after the fact are dated before the log began, on
  // purpose. They are not where the log started.
  const real = stockLog.filter(r => (r.note || "") !== "recorded after the fact");
  if(!real.length) return null;
  return Math.min(...real.map(r => new Date(r.at).getTime()));
}
/* The first business day that can be looked back to: the first sale ever
   recorded, or the first logged movement, whichever is earlier. */
function firstLoggedDay(){
  const ts = [];
  const l = logStartMs(); if(l !== null) ts.push(l);
  sales.forEach(x => { if(x.created_at) ts.push(new Date(x.created_at).getTime()); });
  if(!ts.length) return null;
  return dayOf(new Date(Math.min(...ts)).toISOString());
}
/* A delivery made before the log began has no quantity anywhere. Days before
   it are off by exactly that amount, so they are shown but flagged. An owner
   can enter it after the fact from the delivery form — dated, log-only — and
   the flag goes away. */
function unloggedDeliveriesBefore(dayKey){
  const l = logStartMs(); if(l === null) return false;
  const [y,m,d] = dayKey.split("-").map(Number);
  const close = new Date(y, m-1, d, CONFIG.DAY_START_HOUR); close.setDate(close.getDate()+1);
  return close.getTime() < l;
}

/* The shelf at the END of a business day, item by item.

   Today's figure is known. Every movement since that day's close is in the
   log with its sign. So the shelf then = the shelf now, minus everything
   that happened after. This is exact for as long as every movement has
   been logged — which is why the item form and delivery reversals were
   made to go through the log too.

   The value uses the price paid for the most recent delivery on or before
   that day, which is the cost that was in force then. An item with no
   priced delivery by that day falls back to its current cost, and says so. */
function stockOnDay(dayKey){
  // the close of that business day = the start of the next
  const [y,m,d] = dayKey.split("-").map(Number);
  const closeAt = new Date(y, m-1, d, CONFIG.DAY_START_HOUR, 0, 0, 0);
  closeAt.setDate(closeAt.getDate() + 1);
  const close = closeAt.getTime();

  return items.map(it => {
    let qty = whole(it.stock);
    let costThen = null;
    // whole() is for quantities and clamps below zero. A movement's delta is
    // SIGNED — a sale is negative — so it needs its own reader, or every
    // sale in the log is silently read as nothing and the shelf on any past
    // day comes out as today's figure minus the deliveries alone.
    const signed = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };
    const logFrom = logStartMs();
    stockLog.forEach(r => {
      if(r.item_id !== it.id) return;
      const t = new Date(r.at).getTime();
      if(t >= close) qty -= signed(r.delta);         // undo everything after that day
      else if(r.kind === "purchase" && r.unit_cost != null && costThen === null) costThen = rupees(r.unit_cost);
    });
    // Before the log began, every sale still has to come back onto the
    // shelf. Those sales are in the sales table and nowhere else. From the
    // moment the log began it records every sale itself, so the sales table
    // is only consulted for the gap — never for both, or a sale would be put
    // back twice. A voided sale returned its stock at the time, so it nets
    // to nothing and is skipped.
    if(logFrom !== null){
      sales.forEach(x => {
        if(x.voided || !x.created_at) return;
        const t = new Date(x.created_at).getTime();
        if(t < logFrom && t >= close){
          (x.lines || []).forEach(l => { if(l.id === it.id) qty += whole(l.qty); });
        }
      });
    }
    // stockLog is newest-first, so the first priced purchase seen before
    // `close` is the most recent one — the cost in force that day.
    const cost = costThen != null ? costThen : rupees(it.cost);
    return { id: it.id, name: it.name, qty: Math.max(0, qty), cost, costKnown: costThen != null,
             value: Math.max(0, qty) * cost, photo: it.photo };
  });
}

function stockOnDateHTML(){
  const first = firstLoggedDay();
  const today = todayKey();
  if(!stockLog.length && stockLogFrom === null){
    return `<div class="card"><h3>Stock on a date</h3>
      <div class="empty" style="padding:18px 0"><span class="e">\u{1F4E6}</span>Loading the movement log…</div></div>`;
  }
  if(!first){
    return `<div class="card"><h3>Stock on a date</h3>
      <div class="empty" style="padding:18px 0"><span class="e">\u{1F4C5}</span>No movements recorded yet, so there is no day to look back to.</div></div>`;
  }
  if(!histDate || histDate < first || histDate > today) histDate = today;

  const rows = stockOnDay(histDate).sort((a,b) => b.value - a.value || a.name.localeCompare(b.name));
  const total = rows.reduce((a,r) => a + r.value, 0);
  const units = rows.reduce((a,r) => a + r.qty, 0);
  const guessed = rows.filter(r => !r.costKnown && r.qty > 0).length;
  const isToday = histDate === today;
  const beforeLog = unloggedDeliveriesBefore(histDate);
  const logDay = logStartMs() !== null ? niceDay(dayOf(new Date(logStartMs()).toISOString())) : null;

  const nice = niceDay(histDate);
  return `<div class="card"><h3>Stock on a date</h3>
    <div class="hd-pick">
      <label for="histDate">Show the shelves at the end of</label>
      <input type="date" id="histDate" value="${esc(histDate)}" min="${esc(first)}" max="${esc(today)}">
    </div>
    <div class="hd-hint">Records begin ${niceDay(first)}.${logDay ? ` Every movement has been logged since ${esc(logDay)}; before that, sales are known but deliveries were not written down.` : ""}</div>
    ${beforeLog ? `<div class="hd-hint" style="color:var(--warn)">⚠ This day is before deliveries were being recorded. Every sale since is accounted for, but a delivery that arrived between this day and ${esc(logDay)} was never written down — its units are still counted here as if they had already arrived. So these figures are <b>at most</b> what was on the shelf. Record those deliveries from the Stock tab, with their real date, and this becomes exact.</div>` : ""}

    <div class="stin-head" style="margin-top:12px">
      <div><span class="stin-hk">${isToday ? "Right now" : esc(nice)}</span><span class="stin-hv">${units} units</span></div>
      <div><span class="stin-hk">Items in stock</span><span class="stin-hv">${rows.filter(r=>r.qty>0).length}</span></div>
      <div><span class="stin-hk">Worth, at cost</span><span class="stin-hv money">${money(total)}</span></div>
    </div>
    ${guessed ? `<div class="hd-hint">⚠ ${guessed} item${guessed===1?"":"s"} had no priced delivery by then, so today’s cost is used for ${guessed===1?"it":"them"}.</div>` : ""}

    ${rows.map(r => `<div class="line hd-row">
        ${itemVisual({photo:r.photo, name:r.name}, "ico")}
        <div class="mid">
          <div class="t1">${esc(r.name)}</div>
          <div class="t2">${r.qty} × ${money(r.cost)}${r.costKnown ? "" : ' <span class="stin-warn" title="No priced delivery by this date; today’s cost used">≈</span>'}</div>
        </div>
        <div class="amt" style="color:${r.qty<=0?"var(--bad)":r.qty<=CONFIG.LOW_STOCK?"var(--warn)":"var(--okl)"}">${r.qty}</div>
        <div class="hd-val">${money(r.value)}</div>
      </div>`).join("")}
    <div class="stin-foot">Worked out from today’s shelf and every movement recorded since that day: sales, deliveries and counts. If a movement was never recorded, that day will be off by exactly that much.</div>
  </div>`;
}

/* ----- STOCK ADDED (owner, on the Reports page) -----
   Every delivery, grouped by the day it arrived: what came in, how many, what
   was paid for each, and what the day cost in total. This is the record
   Arslan asked for — "what was added, when, and what it cost" — in one place
   he can scroll, rather than something he has to know to tap on. */
function stockInHTML(){
  if(!isOwner()) return "";

  const seg = `<div class="seg sub" id="stockSeg">${
    ["today","week","month","all"].map(x =>
      `<button data-stockper="${x}" class="${stockPeriod===x?"on":""}">${
        x==="today"?"Today":x==="week"?"Week":x==="month"?"Month":"All"}</button>`).join("")}</div>`;

  if(!stockLog.length && stockLogFrom === null){
    return `<div class="card"><h3>Stock Added</h3>${seg}
      <div class="empty" style="padding:18px 0"><span class="e">\u{1F4E6}</span>Loading deliveries…</div></div>`;
  }

  const dels = deliveriesIn(stockPeriod);
  const label = PERIOD_LABEL[stockPeriod];

  if(!dels.length){
    return `<div class="card"><h3>Stock Added</h3>${seg}
      <div class="empty" style="padding:18px 0"><span class="e">\u{1F9FE}</span>
        No stock was added ${esc(label.toLowerCase())}.<br>
        <span style="font-size:12px">Every delivery is recorded from the <b>Stock</b> tab —
        tap <b>+</b> on an item when a lot comes in, and it appears here with its date and price.</span>
      </div></div>`;
  }

  // Grouped by the day it arrived, newest day first.
  const byDay = {};
  dels.forEach(r=>{
    const k = dayOf(r.at) || String(r.at).slice(0,10);
    (byDay[k] = byDay[k] || []).push(r);
  });
  const days = Object.entries(byDay).sort((a,b)=> b[0].localeCompare(a[0]));
  const total = dels.reduce((a,r)=> a + whole(r.delta)*rupees(r.unit_cost), 0);
  const units = dels.reduce((a,r)=> a + whole(r.delta), 0);

  const body = days.map(([k, rows])=>{
    const dayTotal = rows.reduce((a,r)=> a + whole(r.delta)*rupees(r.unit_cost), 0);
    const lines = rows.map(r=>{
      const it = items.find(x=>x.id===r.item_id);
      const qty = whole(r.delta);
      const priced = r.unit_cost != null;
      const each = priced ? rupees(r.unit_cost) : null;
      // An item deleted from the catalogue leaves its deliveries behind. The
      // raw database id told nobody anything; say plainly what it is, and
      // let it be cleared away.
      const gone = !it;
      return `<div class="stin${gone?" gone":""}">
        ${gone ? '<span class="ico ghost">❓</span>' : itemVisual(it, "ico")}
        <div class="stin-mid" ${gone?"":`data-stockitem="${esc(r.item_id)}"`}>
          <div class="stin-name">${gone ? "Deleted item" : esc(it.name)}</div>
          <div class="stin-sub">${qty} × ${priced ? money(each) : "price not recorded"}${
            priced ? "" : ' <span class="stin-warn">⚠</span>'}</div>
        </div>
        <div class="stin-amt">${priced ? money(qty*each) : "—"}</div>
        <button class="stin-x" data-deldel="${esc(String(r.id))}" title="Remove this delivery">✕</button>
      </div>`;
    }).join("");
    return `<div class="stin-day">
        <span class="stin-date">${niceDay(k)}</span>
        <span class="stin-daytot">${money(dayTotal)}</span>
      </div>${lines}`;
  }).join("");

  return `<div class="card"><h3>Stock Added — ${esc(label)}</h3>${seg}
    <div class="stin-head">
      <div><span class="stin-hk">Deliveries</span><span class="stin-hv">${dels.length}</span></div>
      <div><span class="stin-hk">Units in</span><span class="stin-hv">${units}</span></div>
      <div><span class="stin-hk">Spent</span><span class="stin-hv money">${money(total)}</span></div>
    </div>
    ${body}
    <div class="stin-foot">Tap an item to see its full delivery history and the profit made on each lot.
      Use ✕ to remove a delivery entered by mistake.</div>
  </div>`;
}

/* Removing a delivery that should not be there. The stock it brought in can
   go back with it, because a delivery that never happened never put those
   units on the shelf either — but that is asked, not assumed, since a
   delivery can also be deleted long after the units have been sold. */
function deleteDelivery(logId){
  if(!isOwner()){ toast("Only an owner can remove a delivery", true); return; }
  const r = stockLog.find(x => String(x.id) === String(logId));
  if(!r){ toast("That entry is no longer here", true); return; }
  const it = items.find(x => x.id === r.item_id);
  const qty = whole(r.delta);
  const cost = r.unit_cost == null ? null : qty*rupees(r.unit_cost);

  openSheet(`<h2>Remove this delivery?</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 12px;line-height:1.5">
      <b>${it ? esc(it.name) : "Deleted item"}</b> · ${qty} × ${
        r.unit_cost == null ? "price not recorded" : money(r.unit_cost)}${
        cost == null ? "" : " = " + money(cost)}<br>
      ${new Date(r.at).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
    </p>
    ${it ? `<label style="display:flex;align-items:center;gap:9px;font-size:13px;
        padding:11px;border-radius:11px;background:var(--card2);margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="ddRev" checked style="width:18px;height:18px">
      <span>Also take the ${qty} back off the shelf<br>
        <span style="color:var(--dim);font-size:11.5px">${esc(it.name)} would go from ${it.stock} to ${Math.max(0, it.stock - qty)}.
        Leave this unticked if the stock really did arrive and you are only fixing the price.</span></span>
    </label>` : `<p style="color:var(--dim);font-size:12px;margin:0 0 12px">
      This item has been deleted, so there is no shelf figure to correct.</p>`}
    <div class="mrow"><button class="btn gh" data-x>Cancel</button>
      <button class="btn rd" id="ddok">Remove</button></div>`,
  ()=>{
    $("ddok").onclick = async ()=>{
      if(!sb || !online){ toast("You need a connection to do this", true); return; }
      const rev = !!($("ddRev") && $("ddRev").checked);
      const btn = $("ddok"); btn.disabled = true; btn.textContent = "Removing…";
      try{
        const res = await sb.rpc("delete_delivery", {p_log_id: Number(logId), p_reverse: rev});
        if(res.error) throw res.error;
        stockLog = stockLog.filter(x => String(x.id) !== String(logId));
        if(rev && it && res.data != null){ it.stock = Number(res.data); save(); }
        closeSheet(); render();
        toast("Delivery removed" + (rev ? " · stock corrected" : ""));
      }catch(e){
        toast("Not removed: " + (e && e.message ? e.message : "failed"), true);
        btn.disabled = false; btn.textContent = "Remove";
      }
    };
  });
}

/* ----- REPORTS (owner) ----- */
function viewReport(){
  const list = salesIn(period);
  const rev  = list.reduce((a,s)=>a+s.total,0);
  const prof = list.reduce((a,s)=>a+(s.profit||0),0);
  const units= list.reduce((a,s)=>a+(s.lines||[]).reduce((b,l)=>b+l.qty,0),0);
  const voids = sales.filter(s=>s.voided && new Date(s.created_at).getTime() >= periodStart(period).getTime());

  // ---- day by day ----
  const byDay = {};
  list.forEach(s=>{
    const k = dayOf(s.created_at);
    if(!k) return;
    byDay[k] = byDay[k] || {rs:0, profit:0, n:0, units:0};
    byDay[k].rs += s.total; byDay[k].profit += (s.profit||0); byDay[k].n++;
    byDay[k].units += (s.lines||[]).reduce((b,l)=>b+l.qty,0);
  });
  const days = Object.entries(byDay).sort((a,b)=> b[0].localeCompare(a[0]));
  const peak = days.reduce((m,[,d])=>Math.max(m,d.rs), 0) || 1;
  const todayKeyStr = todayKey();

  // ---- best sellers ----
  const tally = {};                               // #24 key on id so renames do not split history
  list.forEach(s=>(s.lines||[]).forEach(l=>{
    const k = l.id || l.name;
    tally[k] = tally[k] || {q:0, rs:0, id:l.id, name:l.name};
    tally[k].q += l.qty; tally[k].rs += l.qty*l.price; tally[k].name = l.name;
  }));
  const top = Object.values(tally).sort((a,b)=>b.q-a.q).slice(0,10);
  const stockValue = items.reduce((a,i)=>a+(i.cost||0)*(i.stock||0),0);
  // Every delivery in the period being looked at, newest first.
  // The Stock card follows the delivery filter, not the sales one, so the
  // figure here and the list below can never disagree.
  const dels = deliveriesIn(period);
  const spentThis = dels.reduce((a,r)=> a + whole(r.delta)*rupees(r.unit_cost), 0);

  return `
  ${loadingPeriod ? `<div class="banner">Loading ${PERIOD_LABEL[period].toLowerCase()}…</div>` : ""}
  ${periodTruncated && period === "all" ? `<div class="banner"><b>Very large history</b><br>Showing the most recent ${FETCH_CAP.toLocaleString()} sales. Use the CSV export for the complete record.</div>` : ""}
  ${!online && period !== "today" ? `<div class="banner">Offline — showing only what is stored on this device.</div>` : ""}
  <div class="seg" id="pseg">
    ${["today","week","month","all"].map(p=>
      `<button data-per="${p}" class="${period===p?"on":""}">${p==="today"?"Today":p==="week"?"Week":p==="month"?"Month":"All"}</button>`
    ).join("")}
  </div>

  <div class="card">
    <h3>${PERIOD_LABEL[period]}</h3>
    <div style="text-align:center;padding:6px 0 10px"><div class="big">${money(rev)}</div></div>
    <div class="stat"><span class="k">Profit</span><span class="v" style="color:var(--okl)">${money(prof)}</span></div>
    <div class="stat"><span class="k">Sales</span><span class="v">${list.length}</span></div>
    <div class="stat"><span class="k">Items sold</span><span class="v">${units}</span></div>
    <div class="stat"><span class="k">Average sale</span><span class="v">${list.length?money(rev/list.length):money(0)}</span></div>
    ${period!=="today"?`<div class="stat"><span class="k">Average per trading day</span><span class="v">${days.length?money(rev/days.length):money(0)}</span></div>`:""}
    <div class="stat"><span class="k">Voided</span><span class="v" style="color:${voids.length?"var(--bad)":"inherit"}">${voids.length}</span></div>
  </div>

  ${/* The cash/online breakdown lives on the Admin page now, where the gaming
       and snack money can be seen together. This stays a till. The payment is
       still recorded at checkout — only the report moved. */ ""}

  ${days.length?`<div class="card"><h3>Day by day</h3>${days.map(([k,d])=>{
    // Voided sales appear here too, struck through. The day's TOTAL still
    // excludes them — but when you are checking a day, a void is exactly the
    // thing you want to see rather than have hidden.
    const daySales = sales.filter(x => dayOf(x.created_at) === k)
                          .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    return `
    <div class="dayrow ${openDays.has(k)?"open":""}" data-day="${k}">
      <div class="dd">
        <div class="dt ${k===todayKeyStr?"today-hi":""}">${niceDay(k)}</div>
        <div class="ds">${d.n} sale${d.n>1?"s":""} · ${d.units} item${d.units>1?"s":""}</div>
        <div class="daybar" style="width:${Math.max(8, Math.round(d.rs/peak*100))}%"></div>
      </div>
      <div>
        <div class="dv">${money(d.rs)}</div>
        <div class="dp">+${money(d.profit)}</div>
      </div>
      <div class="dchev">\u25be</div>
    </div>
    <div class="daydetail ${openDays.has(k)?"open":""}">${daySales.map(x=>{
      const si = x.gz_session_id ? sessionInfo[x.gz_session_id] : null;
      const t = new Date(x.created_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
      const what = (x.lines||[]).map(l=>`${l.qty}\u00d7 ${esc(l.name)}`).join(", ") || "\u2014";
      return `<div class="dsale ${x.voided?"void":""}">
        <span class="dsw-time">${t}</span>
        <span class="dsw-who">${si ? esc((si.platform||"") + " " + (si.names||"")) : "Counter"}</span>
        <span class="dsw-what">${what}${x.backdated?'<span class="latetag" title="Entered after the fact">LATE</span>':""}</span>
        <span class="dsw-amt">${money(x.total)}</span>
      </div>`;
    }).join("")}</div>`;
  }).join("")}</div>`:`<div class="empty"><span class="e">📊</span>No sales in this period</div>`}

  ${top.length?`<div class="card"><h3>Best sellers</h3>${top.map(d=>`
    <div class="line">${itemVisual(items.find(x=>x.id===d.id)||{},"ico")}
      <div class="mid"><div class="t1">${esc(d.name)}</div><div class="t2">${d.q} sold</div></div>
      <div class="amt">${money(d.rs)}</div></div>`).join("")}</div>`:""}

  <div class="card"><h3>Stock</h3>
    <div class="stat"><span class="k">On the shelves now, at cost</span><span class="v">${money(stockValue)}</span></div>
    <div class="stat"><span class="k">Spent on stock ${PERIOD_LABEL[period].toLowerCase()}</span><span class="v">${money(spentThis)}</span></div>
    <div class="stat"><span class="k">Deliveries ${PERIOD_LABEL[period].toLowerCase()}</span><span class="v">${dels.length} \u00b7 <span style="color:var(--dim);font-weight:600">see History</span></span></div>
    <div class="stat"><span class="k">Items low or out</span><span class="v">${items.filter(i=>i.stock<=CONFIG.LOW_STOCK).length}</span></div>
  </div>


  <button class="btn gh" id="btnCsv" style="width:100%;margin-bottom:11px">Download ${PERIOD_LABEL[period]} as CSV</button>

  ${(()=>{ const all = sales.filter(s=> s.created_at && new Date(s.created_at).getTime() >= periodStart(period).getTime());
     const page = all.slice(0, shown);
     return `<div class="card"><h3>Sales — ${PERIOD_LABEL[period]}</h3>${salesList(page, false, true)}
       ${all.length > shown ? `<button class="btn gh" id="btnMore" style="width:100%;margin-top:11px">
            Show more &nbsp;·&nbsp; ${page.length} of ${all.length}</button>` : ""}
       ${all.length && all.length <= shown && all.length > 100
            ? `<div style="text-align:center;color:var(--dim);font-size:11px;padding-top:9px">All ${all.length} shown</div>` : ""}
     </div>`; })()}`;
}

/* Spreadsheet export so you can keep your own records. */
function exportCsv(){
  const rows = [["Date","Time","Staff","Items","Qty","Revenue (Rs)","Cost (Rs)","Profit (Rs)","Status","Void reason","Voided by"]];
  sales.filter(s=> new Date(s.created_at).getTime() >= periodStart(period).getTime())
       .slice().reverse()
       .forEach(s=>{
    const d = new Date(s.created_at);
    rows.push([
      d.toLocaleDateString("en-GB"), d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}),
      s.staff||"", (s.lines||[]).map(l=>l.qty+"x "+l.name).join("; "),
      (s.lines||[]).reduce((a,l)=>a+l.qty,0),
      s.voided?0:s.total, s.voided?0:(s.cost_total||0), s.voided?0:(s.profit||0),
      s.voided?"VOID":"Completed", s.void_reason||"", s.voided_by||""
    ]);
  });
  const csv = rows.map(r=>r.map(c=>{
    const v = String(c==null?"":c);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(",")).join("\n");
  try{
    const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "404-snacks-" + period + "-" + todayKey() + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("CSV downloaded");
  }catch(e){ toast("Could not create the file", true); }
}

/* How long after the sale it was actually typed in. A miss fixed twenty
   minutes later and one fixed three days later are different things, and the
   number is the only way to tell them apart afterwards. */
function lateGap(s){
  if(!s.backdated || !s.entered_at || !s.created_at) return "";
  const ms = new Date(s.entered_at).getTime() - new Date(s.created_at).getTime();
  if(!(ms > 0)) return "";
  const mins = Math.round(ms/60000);
  const when = mins < 60  ? mins + " min"
             : mins < 1440 ? Math.round(mins/60) + " hr"
             : Math.round(mins/1440) + " day" + (Math.round(mins/1440) > 1 ? "s" : "");
  return " · " + when + " later";
}

function salesList(list, allowVoid, bare){
  if(!list.length) return `<div class="empty"><span class="e">🧾</span>No sales yet</div>`;
  // Ask for any session names we do not have yet.
  loadSessionInfo([...new Set(list.map(x=>x.gz_session_id).filter(Boolean))]);

  const body = list.map(s=>{
    const names = (s.lines||[]).map(l=>`${l.qty}× ${esc(l.name)}`).join(", ");
    const si = s.gz_session_id ? sessionInfo[s.gz_session_id] : null;
    const who = si
      ? `<span class="sesstag">${esc(si.platform || "GAME")}</span><span class="sessname">${esc(si.names || "session")}</span>`
      : `<span class="sesstag counter">COUNTER</span>`;
    const time = new Date(s.created_at).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const canVoid = !s.voided && (isOwner() || (allowVoid && dayOf(s.created_at)===todayKey()));
    return `<div class="line ${s.voided?"void":""}">
      <div class="mid">
        <div class="t0">${who}</div>
        <div class="t1">${names||"—"} ${s.voided?'<span class="tag">VOID</span>':""}${s.backdated?'<span class="latetag">LATE ENTRY</span>':""}</div>
        <div class="t2">${time} · ${esc(s.staff||"")}${payTag(s)}</div>
        ${s.backdated?`<div class="t3" style="color:#c4a6ff">Not rung up at the time · entered by ${esc(s.staff||"?")}${lateGap(s)}</div>`:""}
        ${s.voided?`<div class="t3">Voided${s.voided_by?" by "+esc(s.voided_by):""}${s.void_reason?" \u00b7 "+esc(s.void_reason):""}</div>`:""}
      </div>
      <div class="amt">${money(s.total)}</div>
      ${(!s.voided && isOwner())?`<button class="iconbtn" data-editpay="${esc(s.id)}" title="Change how this was paid">💳</button>`:""}
      ${canVoid?`<button class="iconbtn" data-void="${esc(s.id)}">✕</button>`:""}
    </div>`;
  }).join("");
  return bare ? body : `<div class="card"><h3>Sales</h3>${body}</div>`;
}

/* ----- ITEMS (owner) ----- */

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 8. WIRING ---------- */

  document.querySelectorAll("[data-deldel]").forEach(b=> b.onclick = e=>{

  const hseg = $("histSeg");

  const hd = $("histDate");

  const sseg = $("stockSeg");
  if(sseg) sseg.querySelectorAll("button").forEach(b=> b.onclick = ()=>{
    stockPeriod = b.dataset.stockper;
