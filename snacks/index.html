<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#140B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="404 Snacks">
<meta name="description" content="Snacks and drinks counter for 404 Gaming Zone">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>404 Snacks</title>
<style>
:root{
  --bg:#140B33; --bg2:#1B1145; --card:rgba(255,255,255,.06); --card2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.12); --txt:#FFFFFF; --dim:#9FA8DA; --acc:#7C4DFF; --acc2:#00BCD4;
  --ok:#2E7D32; --okl:#4CAF50; --warn:#F9A825; --bad:#E53935;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:linear-gradient(160deg,#140B33 0%,#1B1145 55%,#0A0620 100%);
  background-attachment:fixed;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior-y:contain;
}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}

/* ---------- LOGIN ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-size:44px;font-weight:800;letter-spacing:5px;line-height:1}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12px;letter-spacing:3.5px;margin-top:7px;margin-bottom:32px}
.pinbox{font-size:34px;letter-spacing:14px;height:60px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:14px;width:240px;margin-bottom:18px}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:12px}
.keys button{height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  font-size:24px;font-weight:600;color:#fff}
.keys button:active{background:var(--card2)}
.keys .wide{background:linear-gradient(90deg,var(--acc),var(--acc2));font-size:16px;font-weight:700}
#loginMsg{color:#FF8A80;min-height:20px;margin-top:14px;font-size:13.5px;text-align:center;
  max-width:330px;line-height:1.45}
#emailForm{width:100%;max-width:330px;display:flex;flex-direction:column;gap:11px}
#emailForm input{height:52px;flex:none;padding:0 15px;font-size:16px;border-radius:13px}
#emailForm .btn{width:100%;height:52px;padding:0;font-size:16px;letter-spacing:.3px;
  /* .btn.pri sets flex:1, which in a column flex container means flex-basis:0
     on the HEIGHT and collapses the button. flex:none lets height:52px win. */
  flex:none;display:flex;align-items:center;justify-content:center;margin-top:3px}
#emailForm .btn:active{transform:scale(.985)}
#emailForm .btn:disabled{opacity:.55}
.authnote{color:var(--dim);font-size:11.5px;text-align:center;margin-top:22px;
  max-width:330px;line-height:1.5}

/* ---------- SHELL ---------- */
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:rgba(0,0,0,.32);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .h-title{font-weight:800;font-size:17px;flex:1;line-height:1.15}
header .h-title small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:1px}
.badge{font-size:10px;padding:4px 9px;border-radius:20px;font-weight:800;letter-spacing:.5px}
.badge.owner{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.badge.staff{background:#37474F}
.dot{width:9px;height:9px;border-radius:50%;background:var(--okl);flex:none}
.dot.off{background:var(--warn)}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px}

main{flex:1;overflow-y:auto;padding:12px 12px 130px;-webkit-overflow-scrolling:touch}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,6,32,.97);
  border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px;background:none;font-size:10.5px;color:var(--dim);font-weight:600}
nav button .ic{display:block;font-size:20px;margin-bottom:3px}
nav button.on{color:#fff}
nav button.on .ic{filter:drop-shadow(0 0 9px var(--acc2))}

/* ---------- ITEM GRID ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 7px;text-align:center;position:relative;transition:transform .08s}
.item.inCart{border-color:var(--acc2);background:rgba(0,188,212,.10)}
/* quantity controls: the ONLY way to change the basket */
.qrow{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:9px}
.qb{width:40px;height:40px;border-radius:12px;font-size:23px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.10);border:1px solid var(--line);color:#fff}
.qb:active{transform:scale(.9)}
.qb.plus{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.qb:disabled{opacity:.25}
.qn{font-size:18px;font-weight:800;min-width:20px;text-align:center}
.item .ico{width:40px;height:40px;margin:0 auto;display:block}
.item .ico svg{width:100%;height:100%;display:block}
.ico img{width:100%;height:100%;object-fit:contain;display:block}
.item .ico.ph{width:46px;height:46px}
.legacy{font-size:30px;line-height:1}
.item .nm{font-size:12px;font-weight:600;margin-top:4px;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:30px}
.item .pr{font-size:14px;font-weight:800;color:var(--acc2);margin-top:3px}
.item .st{font-size:10px;color:var(--dim);margin-top:2px}
.item .st.low{color:var(--warn);font-weight:700}
.item .st.out{color:var(--bad);font-weight:700}
.item.dis{opacity:.4}
.qbadge{position:absolute;top:-6px;right:-6px;background:linear-gradient(90deg,var(--acc),var(--acc2));
  min-width:24px;height:24px;border-radius:12px;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ---------- CART ---------- */
#cartBar{position:fixed;left:0;right:0;bottom:60px;padding:9px 12px;z-index:26;
  background:rgba(10,6,32,.97);border-top:1px solid var(--line)}
#cartBar .row{display:flex;align-items:center;gap:10px}
.btn{border-radius:13px;padding:13px 16px;font-weight:800;font-size:15px}
.btn.pri{background:linear-gradient(90deg,var(--acc),var(--acc2));flex:1}
.btn.gr{background:linear-gradient(90deg,#2E7D32,#43A047);flex:1}
.btn.gh{background:var(--card);border:1px solid var(--line)}
.btn.rd{background:var(--bad)}
.btn:disabled{opacity:.4}
.total{font-size:21px;font-weight:800}
.total small{font-size:11px;color:var(--dim);display:block;font-weight:600}

/* ---------- LIVE SESSIONS ---------- */
.sesswrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}
.sesscard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:13px;color:inherit;font-family:inherit}
.sesscard:active{background:var(--card2)}
.sesscard.over{border-color:rgba(229,57,53,.55);background:rgba(229,57,53,.08)}
.sctop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.plat{font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:#2a3566;color:#cfe0ff}
.plat.ps5{background:#153a7a;color:#a8ccff}.plat.ps4{background:#123055;color:#9ec6f5}
.plat.xbox{background:#14401d;color:#a5e8b4}.plat.pc{background:#3a2a5e;color:#d0bcff}
.sctime{font-size:12px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.sctime.up{color:var(--bad)}
.scname{font-size:16px;font-weight:700;margin:9px 0 8px;line-height:1.25;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.scfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sctab{font-size:12px;font-weight:700;color:var(--acc2)}
.sctab.none{color:var(--dim);font-weight:500}
.scadd{font-size:12px;font-weight:800;color:var(--txt);opacity:.75}
.tl-none{padding:16px 0;color:var(--dim);font-size:13px;text-align:center}
.tline{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.tl-name{flex:1;min-width:0;font-size:14px;font-weight:600}
.tl-name i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:1px}
.tl-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);font-size:18px;font-weight:700;flex:none}
.tl-q{min-width:26px;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tl-amt{min-width:74px;text-align:right;font-weight:800;font-size:14px}
.tl-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.tl-total b{font-size:22px;color:var(--acc2)}
.hintbar{margin-top:12px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.45}
.tabbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding:10px 12px;
  border-radius:13px;background:rgba(0,188,212,.09);border:1px solid rgba(0,188,212,.32)}
.tabback{background:var(--card);border:1px solid var(--line);border-radius:9px;
  width:32px;height:32px;font-size:19px;color:var(--txt);flex:none;line-height:1}
.tabwho b{display:block;font-size:14px}
.tabwho i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:1px}

/* ---------- LATE ENTRY ---------- */
.modeseg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;margin-bottom:11px}
.modeseg button{flex:1;padding:9px 6px;border-radius:10px;background:none;font-size:12.5px;
  font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.modeseg button.on{background:var(--acc);color:#fff}
.modeseg button.on[data-mode="late"]{background:#8e5cf7}
.latebox{margin-bottom:12px;padding:12px;border-radius:13px;
  background:rgba(142,92,247,.10);border:1px solid rgba(142,92,247,.38)}
.latebox .lrow{display:flex;gap:9px}
.latebox .lf{flex:1;min-width:0}
.latebox label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.latebox input{width:100%;padding:10px;border-radius:10px;background:rgba(0,0,0,.32);
  border:1px solid var(--line);color:var(--txt);font-size:14px;font-family:inherit}
.latehint{margin-top:9px;font-size:11.5px;line-height:1.45;color:var(--dim)}
.latehint.bad{color:#ff8a80}
.latehint.good{color:var(--acc2)}
.latetag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.4px;background:rgba(142,92,247,.22);color:#c4a6ff;border:1px solid rgba(142,92,247,.45);
  vertical-align:middle;margin-left:5px}

/* ---------- CASH / ONLINE SHEET ---------- */
.paysheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.paysheet-backdrop.on{opacity:1}
.paysheet{width:min(460px,100%);background:var(--bg2);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(14px);transition:transform .22s}
.paysheet-backdrop.on .paysheet{transform:none}
@media(min-width:560px){.paysheet-backdrop{align-items:center}.paysheet{border-radius:20px;border:1px solid var(--line)}}
.paysheet-amount{font-size:30px;font-weight:800;color:var(--acc2);letter-spacing:-.5px}
.paysheet-q{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:10px 0}
.paysheet-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paysheet-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px;
  border-radius:14px;font-size:15px;font-weight:800;border:2px solid var(--line);
  background:var(--card);color:var(--txt)}
.paysheet-btn span{font-size:26px;line-height:1}
.paysheet-btn.cash:active{border-color:var(--okl);background:rgba(76,175,80,.14);color:var(--okl)}
.paysheet-btn.online:active{border-color:var(--acc2);background:rgba(0,188,212,.14);color:var(--acc2)}
.paysheet-cancel{width:100%;margin-top:10px;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:none;font-size:14px;font-weight:700;color:var(--dim)}
.paytag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;margin-left:6px;vertical-align:middle}
.paytag.cash{background:rgba(76,175,80,.18);color:#7bd07f}
.paytag.online{background:rgba(0,188,212,.18);color:#5fd8e6}
.paytag.none{background:rgba(249,168,37,.18);color:#f9c65b}
.paytag.split{background:rgba(149,117,255,.18);color:#c0aaff}
/* Some cash, some online. A wide third button, so Cash and Online stay the
   big obvious pair staff hit all night without looking. */
.paysheet-btn.split{flex-direction:row;gap:8px;width:100%;margin-top:10px;padding:14px 10px;font-size:14px}
.paysheet-btn.split span{font-size:18px}
.paysheet-btn.split:active{border-color:#9575ff;background:rgba(149,117,255,.14);color:#c0aaff}
.paysplit-box{margin-top:12px;padding:14px;border-radius:14px;
  border:2px solid rgba(149,117,255,.35);background:rgba(149,117,255,.06)}
.paysplit-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.paysplit-row label{flex:0 0 76px;font-size:13px;font-weight:800;color:var(--txt)}
.paysplit-row input{flex:1 1 auto;min-width:0;padding:12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--txt);
  font-family:inherit;font-size:17px;font-weight:800}
.paysplit-hint{font-size:12.5px;font-weight:700;margin:2px 0 10px;min-height:17px;color:var(--dim)}
.paysplit-hint.ok{color:var(--okl)}
.paysplit-hint.bad{color:var(--warn)}
.paysheet-btn.confirm{flex-direction:row;width:100%;padding:14px;margin:0;
  border-color:var(--acc2);background:var(--acc2);color:#04222a}
.paysheet-btn.confirm:disabled{opacity:.4}
.line .t0{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.sesstag{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:20px;
  background:#153a7a;color:#a8ccff}
.sesstag.counter{background:rgba(255,255,255,.08);color:var(--dim)}
.sessname{font-size:12px;font-weight:700;color:var(--acc2)}
.line .t3{font-size:11px;color:var(--bad);margin-top:2px}
.paysplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.psi{padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.psi.cash{border-color:rgba(76,175,80,.35);background:rgba(76,175,80,.07)}
.psi.online{border-color:rgba(0,188,212,.35);background:rgba(0,188,212,.07)}
.psl{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}
.psv{font-size:20px;font-weight:800;margin-top:3px}
.psi.cash .psv{color:#7bd07f}
.psi.online .psv{color:var(--acc2)}
.pss{font-size:10.5px;color:var(--dim);margin-top:1px}

/* ---------- CARDS / LISTS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}
.card h3{margin:0 0 9px;font-size:13px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stat:last-child{border:none}
.stat .k{color:var(--dim);font-size:13px}
.stat .v{font-weight:800;font-size:17px}
.big{font-size:31px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent}

.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.line:last-child{border:none}
.line .ico{width:30px;height:30px;flex:none}
.line .ico svg{width:100%;height:100%;display:block}
.line .ico.ph{width:36px;height:36px}
.line .mid{flex:1;min-width:0}
.line .t1{font-size:14px;font-weight:600}
.line .t2{font-size:11px;color:var(--dim);margin-top:1px}
.line .amt{font-weight:800;font-size:15px}
/* Only the ITEMS are struck through. Who voided it and why must stay easy
   to read - that is the part you go looking for. */
/* text-decoration must be cleared HERE: a strike drawn on the parent cannot
   be removed by a child, so scoping it to .t1 alone is not enough. */
.line.void{opacity:1;text-decoration:none}
.line.void .t1{text-decoration:line-through;opacity:.5}
.line.void .amt{text-decoration:line-through;opacity:.5}
.line.void .t0,.line.void .t2{opacity:.75}
.line.void .t3{opacity:1;color:var(--bad);font-weight:600}
.void{opacity:.45;text-decoration:line-through}
.tag{font-size:9px;background:var(--bad);padding:2px 6px;border-radius:9px;font-weight:800;vertical-align:middle}

/* ---------- FORMS ---------- */
label{display:block;font-size:11px;color:var(--dim);margin:9px 0 4px;letter-spacing:.5px;font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=password],
input[type=tel],input[type=search],select,textarea{
  width:100%;padding:11px;border-radius:11px;-webkit-appearance:none;appearance:none;
  background:rgba(0,0,0,.35);border:1px solid var(--line);color:#fff;
  transition:border-color .15s, box-shadow .15s, background-color .15s}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--acc2);background:rgba(0,0,0,.5);
  box-shadow:0 0 0 3px rgba(0,188,212,.16)}
input::placeholder,textarea::placeholder{color:#7B85B8}
/* the browser's saved-password fill otherwise paints these white */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:#fff;caret-color:#fff;
  -webkit-box-shadow:0 0 0 1000px #191046 inset;
  transition:background-color 9999s ease-in-out 0s}
.frow{display:flex;gap:9px}.frow>div{flex:1}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#1B1145;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.mrow{display:flex;gap:9px;margin-top:15px}.mrow .btn{flex:1}
.emopick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px;
  max-height:260px;overflow-y:auto;background:rgba(0,0,0,.28);padding:8px;border-radius:11px}
.emopick button{padding:7px 3px 5px;background:none;border-radius:9px;border:1px solid transparent}
.emopick button img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
.emopick button span{display:block;font-size:9px;color:var(--dim);margin-top:3px;text-transform:capitalize}
.emopick button.on{background:var(--acc);border-color:#fff}
.emopick button.on span{color:#fff;font-weight:700}
.tintrow{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}
.tintrow button{width:34px;height:34px;border-radius:9px;border:2px solid transparent}
.tintrow button.on{border-color:#fff}
.photorow{display:flex;gap:11px;align-items:center;margin-top:5px}
.thumb{width:76px;height:76px;border-radius:13px;background:rgba(0,0,0,.35);
  border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}

/* ---------- SOUND ----------
   Every sound is synthesised on the fly, so this costs no downloads and works
   offline. Kept short and quiet — it should feel like feedback, not noise. */
const Sound = (function(){
  let ctx = null, on = true;
  try{ on = localStorage.getItem("g404_sound") !== "0"; }catch(e){}

  function audio(){
    try{
      if(!ctx){
        const C = window.AudioContext || window.webkitAudioContext;
        if(!C) return null;
        ctx = new C();
      }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }

  function tone(freq, dur, vol, type, delay, slideTo){
    if(!on) return;
    const c = audio(); if(!c) return;
    try{
      const t0 = c.currentTime + (delay || 0);
      const osc = c.createOscillator(), gain = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.008);      // quick fade in
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); // soft tail
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    }catch(e){}
  }

  return {
    get enabled(){ return on; },
    unlock(){ audio(); },
    toggle(){
      on = !on;
      try{ localStorage.setItem("g404_sound", on ? "1" : "0"); }catch(e){}
      if(on) tone(760, 0.07, 0.05);
      return on;
    },

const bizDate = d => { const x = new Date(d); x.setHours(x.getHours() - CONFIG.DAY_START_HOUR); return x; };
const keyOf = d => { const x = bizDate(d); return x.getFullYear()+"-"+pad2(x.getMonth()+1)+"-"+pad2(x.getDate()); };
const todayKey = () => keyOf(new Date());
const dayOf = iso => iso ? keyOf(new Date(iso)) : "";
const startOfDay = d => { const x = bizDate(d); x.setHours(0,0,0,0); x.setHours(x.getHours() + CONFIG.DAY_START_HOUR); return x; };
/* Plain calendar date for <input type="date">, which wants local yyyy-mm-dd
   and not a business day. Same UTC trap as above, so built by hand. */
const ymdLocal = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());

/* Start date for the chosen filter. */
function periodStart(p){
  const now = new Date();
  if(p === "today") return startOfDay(now);
  if(p === "week"){                     // this week, Monday to Sunday
    const b = bizDate(now);
    const backToMonday = (b.getDay() + 6) % 7;   // 0 = Monday
    const s = startOfDay(now); s.setDate(s.getDate() - backToMonday); return s;
  }
  if(p === "month"){ const b = bizDate(now); const s = new Date(b.getFullYear(), b.getMonth(), 1); s.setHours(CONFIG.DAY_START_HOUR); return s; }
  return new Date(0);
}
const PERIOD_LABEL = {today:"Today", week:"This week", month:"This month", all:"All time"};

  const from = periodStart(p).getTime();
  return sales.filter(s => !s.voided && s.created_at && new Date(s.created_at).getTime() >= from);

  const d = new Date(key + "T00:00:00");
  const t = keyOf(new Date());
  const y = keyOf(new Date(Date.now() - 864e5));

  if(key === y) return "Yesterday";
