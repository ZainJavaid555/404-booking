/* Keeps the hint line and the Checkout button honest as the fields change. */
function refreshLate(){
  const el = $("lateHint");
  if(el){
    const why = lateProblem(), t = lateStamp();
    el.className = "latehint " + (why ? "bad" : "good");
    el.innerHTML = why
      ? esc(why)
      : "Recording a sale from " + esc(t.toLocaleString("en-GB",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}))
        + " — filed under that night and marked as a late entry.";
  }
  updateCartBar();
}
function bumpCart(id, delta){
  const it = items.find(i=>i.id===id); if(!it) return;
  const have = Math.round(Number(cart[id])) || 0;
  let next = have + delta;
  if(next < 0) next = 0;
  if(delta > 0){
    if(!(it.price > 0)){ toast("Set a price for " + it.name + " first", true); return; }
    if(next > it.stock){ toast("Only " + it.stock + " in stock", true); return; }
  }
  if(next === 0) delete cart[id]; else cart[id] = next;
  if(delta > 0) Sound.add(); else Sound.drop();
  saveCartSoon();  // basket survives a refresh, without rewriting all sales each tap
  refreshCard(id);
  updateCartBar();
}
/* Update just this one card so the grid does not flicker or jump. */
function refreshCard(id){
  const el = document.querySelector('[data-card="' + id + '"]');
  const it = items.find(i=>i.id===id);
  if(!el || !it) return render();
  const q = cart[id] || 0;
  el.classList.toggle("inCart", q > 0);
  const qn = el.querySelector(".qn"); if(qn) qn.textContent = q;
  const minus = el.querySelector(".minus"); if(minus) minus.disabled = q <= 0;
  const plus  = el.querySelector(".plus");
  if(plus) plus.disabled = !(it.price > 0) || it.stock <= 0 || q >= it.stock;
  let badge = el.querySelector(".qbadge");
  if(q){
    if(badge) badge.textContent = q;
    else { badge = document.createElement("span"); badge.className = "qbadge"; badge.textContent = q; el.prepend(badge); }
  } else if(badge) badge.remove();
}
function updateCartBar(){
  const ids = Object.keys(cart);
  const n = ids.reduce((a,k)=>a+cart[k],0);
  const tot = ids.reduce((a,k)=>{
    const it = items.find(i=>i.id===k); return a + (it ? it.price*cart[k] : 0);
  },0);
  $("cartTotal").innerHTML = money(tot) + `<small>${n?n+" item"+(n>1?"s":""):"empty"}</small>`;
  const late = (saleMode === "late" && !tabFor);
  // A late entry with a bad date must not be saveable, so the button says so
  // rather than failing after the tap.
  $("btnPay").textContent = late ? "Save Late Entry" : "Checkout";
  $("btnPay").disabled = !n || (late && !!lateProblem());
  $("btnClear").disabled = !n;
}

/* ---------- 9. CHECKOUT ---------- */
let gzSessions = [];        // live gaming sessions, read from the gaming zone
let gzTabs = {};            // session id -> { items, amount } still unpaid
let tabFor = null;          // the session we are currently adding snacks to
const openDays = new Set(); // which day rows are expanded in Reports
let checkingOut = false;
async function checkout(){
  if(checkingOut) return;                       // belt and braces against a double tap
  const ids = Object.keys(cart); if(!ids.length) return;

  // A late entry is checked once more here, not just when the button was
  // drawn: the clock moves, and "tonight" can stop being tonight at 4am
  // while the basket sits on the counter.
  const isLate = (saleMode === "late" && !tabFor);
  if(isLate){
    const why = lateProblem();
    if(why){ toast(why, true); return; }
  }

  checkingOut = true;
  try{
    const lines = [];
    const now = isLate ? lateStamp().toISOString() : new Date().toISOString();
    let total = 0, cost = 0;
    const dropped = [];

    for(const id of ids){
      const it = items.find(i=>i.id===id);
      const q  = Math.round(Number(cart[id])) || 0;
      if(!it){ dropped.push("a deleted item"); continue; }        // #10
      if(q <= 0){ dropped.push(it.name); continue; }
      if(!(it.price > 0)){                                        // #9 re-check at sale time
        toast("\u201C" + it.name + "\u201D has no price. Remove it or set a price.", true);
        return;
      }
      if(it.active === false){                                    // #23 hidden but still in basket
        toast("\u201C" + it.name + "\u201D is hidden. Remove it from the basket.", true);
        return;
      }
      if(q > it.stock){
        toast("Only " + it.stock + " \u00D7 " + it.name + " in stock", true);
        return;
      }
      lines.push({id:it.id, name:it.name, qty:q, price:rupees(it.price), cost:rupees(it.cost)});
      total += rupees(it.price)*q; cost += rupees(it.cost)*q;
    }

    if(!lines.length){                                            // #10 never record an empty sale
      cart = {}; save(); render();
      toast("Nothing left to sell — those items were removed", true);
      return;
    }
    if(dropped.length) toast("Skipped: " + dropped.join(", "), true);

    // A session tab is not paid now: it is settled with the gaming bill when
    // the session ends. A walk-in at the counter pays straight away.
    let pay = null;
    if(!tabFor){
      pay = await askPayment(money(total), total);
      if(!pay){ checkingOut = false; return; }
    }

    const sale = {
      id: uid(), created_at: now, lines,
      total: Math.round(total), cost_total: Math.round(cost), profit: Math.round(total-cost),
      staff: currentUser(), user_id: (user && user.id) || null,
      pay_method: pay ? pay.method : null,
      // The amounts are the truth; pay_method is shorthand. A split bill is
      // only countable if both halves are written down.
      cash_amount:   pay ? Math.round(pay.cash   || 0) : null,
      online_amount: pay ? Math.round(pay.online || 0) : null,
      gz_session_id: tabFor ? tabFor.id : null,
      settled_at: tabFor ? null : new Date().toISOString(),
      // created_at is when the customer was served; entered_at is when it was
      // typed in. For an ordinary sale they match. When they do not, the gap
      // is exactly what the Reports badge is there to show.
      backdated: isLate,
      entered_at: new Date().toISOString(),
      voided: false, void_reason: null
    };
    // A session gets ONE row that grows, not a new row per trip to the counter.
    // The id is derived from the session so it is the same row every time.
    if(tabFor) sale.id = "tab_" + tabFor.id;

    // Mirror the server-side merge locally so the list looks the same at once.
    if(tabFor){
      const existing = sales.find(x => x.id === sale.id && !x.voided && !x.settled_at);
      if(existing){
        lines.forEach(l => {
          const hit = (existing.lines || []).find(e => e.id === l.id);
          if(hit) hit.qty += l.qty; else existing.lines.push({...l});
        });
        existing.total      = (existing.lines||[]).reduce((n,l)=>n + rupees(l.price)*l.qty, 0);
        existing.cost_total = (existing.lines||[]).reduce((n,l)=>n + rupees(l.cost)*l.qty, 0);
        existing.profit     = existing.total - existing.cost_total;
        sale.__merged = true;
      }
    }

    const before = items.map(i=>({id:i.id, stock:i.stock}));      // #5 exact rollback
    lines.forEach(l=>{ const it = items.find(i=>i.id===l.id); if(it) it.stock -= l.qty; });
    const keptCart = Object.assign({}, cart);
    if(!sale.__merged) sales.unshift(sale);
    cart = {};

    if(!save()){                                                  // #5 #6 restore everything faithfully
      if(!sale.__merged) sales.shift();
      before.forEach(b=>{ const it = items.find(i=>i.id===b.id); if(it) it.stock = b.stock; });
      cart = keptCart;
      save();                                                     // persist the restored state too
      render();
      return;
    }
    // Back to normal selling straight away. Leaving the app in late mode is
    // how the next customer's sale quietly gets the wrong date on it.
    const lateWhen = isLate ? new Date(now) : null;
    if(isLate){ saleMode = "now"; lateDate = ""; lateTime = ""; }

    render();
    Sound.sale();
    toast(tabFor
      ? "Added to " + tabFor.label + "\u2019s tab \u00B7 " + money(total)
      : lateWhen
        ? "Late entry saved \u00B7 " + money(total) + " \u00B7 filed under "
          + lateWhen.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})
        : "Sale saved \u00B7 " + money(total) + " \u00B7 " + (pay === "cash" ? "Cash" : "Online"));
    if(tabFor){
      const t = gzTabs[tabFor.id] || { items:0, amount:0 };
      gzTabs[tabFor.id] = { items: t.items + lines.length, amount: t.amount + Math.round(total) };
    }

    if(tabFor) await push("tabAdd", { session: tabFor.id, lines, staff: currentUser() });
    else       await push("sale", sale);
    for(const l of lines) await pushStock(l.id, -l.qty);          // #8 delta, not absolute
  } finally {
    checkingOut = false;
  }
}

/* Asks how the money was taken. Resolves "cash" | "online" | null.
   One extra tap per sale, and it is the only way to know what should be in
   the drawer at the end of the night. Works offline like everything else. */
/* How a counter sale was settled. Returns { method, cash, online } or null if
   staff backed out. Never a bare label: a customer who hands over Rs. 600 and
   transfers Rs. 400 cannot be described by one word, and pretending otherwise
   is what leaves the drawer disagreeing with the report at closing. */
function askPayment(amountText, total){
  const due = Math.round(Number(total) || 0);
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "paysheet-backdrop";
    wrap.innerHTML =
      '<div class="paysheet">' +
        '<div class="paysheet-amount">' + amountText + '</div>' +
        '<div class="paysheet-q">How was it paid?</div>' +
        '<div class="paysheet-row">' +
          '<button class="paysheet-btn cash" data-pay="cash"><span>\u{1F4B5}</span>Cash</button>' +
          '<button class="paysheet-btn online" data-pay="online"><span>\u{1F4F1}</span>Online</button>' +
        '</div>' +
        (due > 0 ? '<button class="paysheet-btn split" data-pay="split"><span>⇆</span>Some cash, some online</button>' : '') +
        '<div class="paysplit-box" id="psBox" hidden>' +
          '<div class="paysplit-row"><label>Cash</label><input type="number" id="psCash" inputmode="numeric" min="0"></div>' +
          '<div class="paysplit-row"><label>Online</label><input type="number" id="psOnl" inputmode="numeric" min="0"></div>' +
          '<div class="paysplit-hint" id="psHint"></div>' +
          '<button class="paysheet-btn confirm" id="psOk">Confirm</button>' +
        '</div>' +
        '<button class="paysheet-cancel" data-pay="">Cancel</button>' +
      '</div>';
    document.body.appendChild(wrap);
    requestAnimationFrame(()=>wrap.classList.add("on"));

    let settled = false;
    const done = v => { if(settled) return; settled = true; wrap.remove(); resolve(v); };

    const box  = wrap.querySelector("#psBox");
    const cEl  = wrap.querySelector("#psCash");
    const oEl  = wrap.querySelector("#psOnl");
    const hint = wrap.querySelector("#psHint");
    const ok   = wrap.querySelector("#psOk");

    // Type one side, the other fills itself. Nobody should be doing mental
    // arithmetic at the counter with a customer waiting.
    function show(){
      const c = Math.round(Number(cEl.value) || 0), o = Math.round(Number(oEl.value) || 0);
      const diff = (c + o) - due;
      hint.className = "paysplit-hint" + (diff === 0 ? " ok" : " bad");
      hint.textContent = diff === 0
        ? money(c) + " cash + " + money(o) + " online = " + money(due)
        : diff > 0 ? money(diff) + " more than the bill"
                   : money(-diff) + " still to account for";
      ok.disabled = diff !== 0;
    }
    cEl.oninput = ()=>{ if(cEl.value !== "") oEl.value = Math.max(0, due - Math.round(Number(cEl.value)||0)); show(); };
    oEl.oninput = ()=>{ if(oEl.value !== "") cEl.value = Math.max(0, due - Math.round(Number(oEl.value)||0)); show(); };
    ok.onclick  = ()=>{
      const c = Math.round(Number(cEl.value) || 0), o = Math.round(Number(oEl.value) || 0);
      if(c + o !== due) return;
      done({ method: c === 0 ? "online" : o === 0 ? "cash" : "split", cash: c, online: o });
    };

    wrap.onclick = e => {
      if(e.target === wrap) return done(null);
      const b = e.target.closest("[data-pay]");
      if(!b) return;
      const v = b.dataset.pay;
      if(v === "split"){ box.hidden = false; b.style.display = "none"; cEl.value = ""; oEl.value = ""; show(); cEl.focus(); return; }
      if(v === "cash")   return done({ method:"cash",   cash: due, online: 0 });
      if(v === "online") return done({ method:"online", cash: 0,   online: due });
      done(null);
    };
  });
}

/* ---------- 9a. STOCK MOVEMENTS (owner) ----------
   stock_log records every movement with a date. Deliveries carry the price
   paid; sales are the till taking stock off the shelf; counts are a shelf
   count correcting the figure. Owners only — the read policy enforces it. */
let stockLog = [];          // newest first
let stockLogFrom = null;    // how far back we have fetched

async function loadStockLog(fromMs){
  if(!sb || !isOwner()) return;
  try{
    const r = await sb.from("stock_log")
      .select("id,item_id,delta,unit_cost,kind,note,at")
      .gte("at", new Date(Math.max(0, fromMs)).toISOString())
      .order("at", {ascending:false})
      .limit(2000);
    if(r.error) throw r.error;
    stockLog = r.data || [];
    stockLogFrom = fromMs;
  }catch(e){
    // The columns only exist once stock_in.sql has been run. Until then the
    // Stock page simply shows what it always did rather than breaking.
    console.warn("stock history unavailable:", e && e.message);
    stockLog = [];
  }
}

/* Fetch far enough back for whatever period is on screen. stockLogFrom
   remembers how far we already went, so switching Today -> Month fetches
   once and switching back fetches nothing. */
async function ensureStockLog(p){
  if(!sb || !isOwner()) return false;
  const want = periodStart(p).getTime();
  if(stockLogFrom !== null && stockLogFrom <= want) return false;
  await loadStockLog(want);
  return true;
}

/* The Stock Added list has its OWN period. It follows what came IN, which is
   a different question from what was sold, so tying it to the sales filter
   above it meant you could not look at a week of deliveries against a day of
   takings. */
let stockPeriod = "month";

const deliveries = () => stockLog.filter(r => r.kind === "purchase");
const deliveriesIn = p => {
  const from = periodStart(p).getTime();
  return deliveries().filter(r => new Date(r.at).getTime() >= from);
};
const lastDelivery = id => deliveries().find(r => r.item_id === id) || null;
const spentIn = from => deliveries()
  .filter(r => new Date(r.at).getTime() >= from)
  .reduce((a,r) => a + (Number(r.delta)||0) * (Number(r.unit_cost)||0), 0);
/* What the shelves are worth at what we paid, not at what we sell for. */
const shelfValue = () => items.reduce((a,i) => a + Math.max(0, whole(i.stock)) * rupees(i.cost), 0);

/* What a sale's payment tag should say.

   A sale on a session's tab is settled with the gaming bill when the session
   ends, so it carries the session's LABEL but no amounts of its own — the
   session row on the Admin page holds the whole bill. Printing "Rs. 0 CASH"
   for one of those was wrong in the way that matters: it read as no money
   having changed hands, when in fact the money was recorded, just somewhere
   else. It now says where. */
function payTag(s){
  const onSession = !!s.gz_session_id;
  if(!s.pay_method) return '<span class="paytag none">NOT RECORDED</span>';

  if(s.pay_method === "split"){
    if(s.cash_amount == null || s.online_amount == null){
      return '<span class="paytag split">SPLIT \u00b7 ' +
             (onSession ? 'ON THE SESSION BILL' : 'AMOUNTS NOT RECORDED') + '</span>';
    }
    return '<span class="paytag split">' + money(s.cash_amount) + ' CASH + ' +
           money(s.online_amount) + ' ONLINE</span>';
  }

  const word = s.pay_method === "cash" ? "CASH" : "ONLINE";
  return '<span class="paytag ' + s.pay_method + '">' + word +
         (onSession ? ' \u00b7 ON THE SESSION BILL' : '') + '</span>';
}

/* ---------- 9b. CORRECT HOW A SALE WAS PAID ----------
   Owners only, and the payment method only. The items and the amount are not
   editable here on purpose: changing what a sale SAYS it was is exactly the
   hole that lets cash walk, so an amount that is wrong gets voided and rung
   up again, which stays visible. Correcting cash-vs-online leaves the money
   untouched and only makes the drawer add up, so it is safe to allow.

   Goes to the database only — like a void. A payment correction that lived on
   one phone would be worse than none at all. */
function editPayment(id){
  if(!isOwner()){ toast("Only an owner can change how a sale was paid", true); return; }
  const s = sales.find(x => x.id === id);
  if(!s){ toast("That sale is no longer here", true); return; }
  if(s.voided){ toast("This sale is voided", true); return; }

  const cur = s.pay_method || "";
  const due = Math.round(Number(s.total) || 0);
  const pick = v => `<button class="btn ${v===cur?"pri":"gh"}" data-set="${v}" style="flex:1">${
      v==="cash" ? "💵 Cash" : v==="online" ? "📱 Online" : "⚠ Not recorded"}</button>`;

  openSheet(`<h2>How was this paid?</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 12px">
      ${money(s.total)} · ${esc((s.lines||[]).map(l=>l.qty+"× "+l.name).join(", ") || "—")}<br>
      Only the payment method changes. The items and the amount stay as they are.
    </p>
    <div class="mrow" style="gap:8px;margin-bottom:10px">${pick("cash")}${pick("online")}</div>
    <div class="mrow" style="gap:8px;margin-bottom:10px">
      <button class="btn ${cur==="split"?"pri":"gh"}" id="epSplit" style="flex:1">⇆ Some cash, some online</button>
    </div>
    <div class="paysplit-box" id="epBox" ${cur==="split"?"":"hidden"} style="margin-bottom:10px">
      <div class="paysplit-row"><label>Cash</label><input type="number" id="epCash" inputmode="numeric" min="0"
        value="${cur==="split"?Math.round(Number(s.cash_amount)||0):""}"></div>
      <div class="paysplit-row"><label>Online</label><input type="number" id="epOnl" inputmode="numeric" min="0"
        value="${cur==="split"?Math.round(Number(s.online_amount)||0):""}"></div>
      <div class="paysplit-hint" id="epHint"></div>
      <button class="paysheet-btn confirm" id="epOk">Save the split</button>
    </div>
    <div class="mrow" style="gap:8px">${pick("")}<button class="btn gh" data-x style="flex:1">Cancel</button></div>`,
  ()=>{
    /* One place that writes the correction, whichever button asked for it.
       The amounts go to the server, not the label — the label is derived
       there, so it can never end up disagreeing with the money. */
    async function apply(cash, onl, said){
      if(!sb || !online){ toast("You need a connection to change this", true); return; }
      document.querySelectorAll("[data-set],#epOk,#epSplit").forEach(x => x.disabled = true);
      try{
        const r = await sb.rpc("gz_set_payment_split",
          { p_sale_id: id, p_session_id: null, p_cash: cash, p_online: onl });
        if(r.error) throw r.error;
        if(!Number(r.data)){ toast("That sale was not found on the server", true); return; }
        const live = sales.find(x => x.id === id);
        if(live){
          live.pay_method   = (cash === 0 && onl === 0) ? null : onl === 0 ? "cash" : cash === 0 ? "online" : "split";
          live.cash_amount   = (cash === 0 && onl === 0) ? null : cash;
          live.online_amount = (cash === 0 && onl === 0) ? null : onl;
        }
        save(); closeSheet(); render();
        toast(said);
      }catch(e){
        toast("Not changed: " + (e && e.message ? e.message : "failed"), true);
        document.querySelectorAll("[data-set],#epOk,#epSplit").forEach(x => x.disabled = false);
      }
    }

    document.querySelectorAll("[data-set]").forEach(b => b.onclick = ()=>{
      const val = b.dataset.set || null;
      apply(val === "cash" ? due : 0, val === "online" ? due : 0,
            val ? "Marked as " + (val === "cash" ? "Cash" : "Online") : "Marked as not recorded");
    });

    const box = $("epBox"), cEl = $("epCash"), oEl = $("epOnl"), hint = $("epHint"), ok = $("epOk");
    function show(){
      const c = Math.round(Number(cEl.value) || 0), o = Math.round(Number(oEl.value) || 0);
      const diff = (c + o) - due;
      hint.className = "paysplit-hint" + (diff === 0 ? " ok" : " bad");
      hint.textContent = diff === 0
        ? money(c) + " cash + " + money(o) + " online = " + money(due)
        : diff > 0 ? money(diff) + " more than the bill" : money(-diff) + " still to account for";
      ok.disabled = diff !== 0;
    }
    $("epSplit").onclick = ()=>{ box.hidden = false; show(); cEl.focus(); };
    cEl.oninput = ()=>{ if(cEl.value !== "") oEl.value = Math.max(0, due - Math.round(Number(cEl.value)||0)); show(); };
    oEl.oninput = ()=>{ if(oEl.value !== "") cEl.value = Math.max(0, due - Math.round(Number(oEl.value)||0)); show(); };
    ok.onclick  = ()=>{
      const c = Math.round(Number(cEl.value) || 0), o = Math.round(Number(oEl.value) || 0);
      if(c + o !== due) return;
      apply(c, o, "Split saved: " + money(c) + " cash, " + money(o) + " online");
    };
    show();
  });
}

/* ---------- 10. VOID ---------- */
function voidSale(id){
  const s = sales.find(x=>x.id===id);
  if(!s) return;
  if(s.voided){ toast("Already voided", true); return; }          // #14 double void
  openSheet(`<h2>Void this sale?</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 4px">${money(s.total)} — stock is returned. The sale stays in the record marked VOID.</p>
    <label>Reason (required)</label>
    <input type="text" id="vr" placeholder="Why is this being voided?" maxlength="120" autocomplete="off">
    <div class="mrow"><button class="btn gh" data-x>Cancel</button><button class="btn rd" id="vok">Void Sale</button></div>`,
  ()=>{
    $("vok").onclick = async ()=>{
      const r = ($("vr").value || "").trim();
      if(!r){ toast("Write a reason", true); return; }
      const live = sales.find(x=>x.id===id);
      if(!live || live.voided){ closeSheet(); render(); toast("Already voided", true); return; }

      // A void changes the money record, so it only ever happens in the
      // database. No connection, no void — never a void that exists on one
      // phone and nowhere else. Selling still works offline; this does not.
      if(!sb || !online){
        Sound.error();
        toast("Voiding needs internet. Selling still works — void it once the dot is green.", true);
        return;
      }
      const btn = $("vok"); btn.disabled = true; btn.textContent = "Voiding…";
      const at = new Date().toISOString(), by = currentUser();
      try{
        const res = await sb.from("sales")
          .update({voided:true, void_reason:r, voided_by:by, voided_at:at})
          .eq("id", id).eq("voided", false).select("id");
        if(res.error) throw res.error;
        if(!res.data || !res.data.length){
          Sound.error();
          toast("The database refused this void — it may already be voided, or too old for your account.", true);
          btn.disabled = false; btn.textContent = "Void Sale";
          return;
        }
      }catch(e){
        Sound.error();
        toast("Void failed: " + why(e) + ". Nothing was changed.", true);
        btn.disabled = false; btn.textContent = "Void Sale";
        return;
      }

      // The database accepted it. Only now does this device follow.
      const missing = [];
      live.voided = true; live.void_reason = r; live.voided_by = by; live.voided_at = at;
      (live.lines||[]).forEach(l=>{
        const it = items.find(i=>i.id===l.id);
        if(it) it.stock += l.qty; else missing.push(l.name);      // #15 tell the truth
      });
      save();
      closeSheet(); render(); Sound.voided();
      toast(missing.length ? "Voided. Stock not returned for: " + missing.join(", ") : "Sale voided", missing.length?true:false);
      for(const l of (live.lines||[])){
        if(items.find(i=>i.id===l.id)) await pushStock(l.id, +l.qty);
      }
    };
  });
}

/* ---------- 11. ITEM EDITOR (owner) ---------- */
/* withStock is deliberately opt-in. Everywhere else stock moves as a DELTA
   through adjust_stock, precisely so two phones cannot overwrite each other.
   Sending it as an absolute here undid that: an owner opening Edit on Coke
   (stock 20) to correct a price, while staff sold four at the counter, wrote
   20 straight back over the server's 16 and silently restored the four sold
   units. Only the first catalogue upload, into an empty table, sends stock. */
function stripItem(i, withStock){
  const row = {id:i.id, photo:i.photo||"", name:i.name, cost:rupees(i.cost), price:rupees(i.price), active:i.active!==false};
  if(withStock) row.stock = whole(i.stock);
  return row;
}
function itemModal(id){
  if(!isOwner()) return;
  const it = items.find(i=>i.id===id) || {name:"",cost:0,price:0,stock:0,active:true};
  const isNew = !id;
  let photo = it.photo || "";

  const thumb = () => photo ? `<img src="${esc(stamp(safeSrc(photo)))}" alt="">` : FALLBACK;
  const lib = () => `<div class="emopick" id="ep">${PRODUCTS.map(p=>{
      const src = "./products/"+p[0]+".png";
      return `<button data-p="${src}" class="${src===photo?"on":""}"><img src="${stamp(src)}" alt=""><span>${esc(p[1])}</span></button>`;
    }).join("")}</div>`;

  openSheet(`<h2>${isNew?"New Item":"Edit Item"}</h2>
    <label>Product photo</label>
    <div class="photorow">
      <div class="thumb" id="pth">${thumb()}</div>
      <div style="flex:1">
        <button class="btn gh" id="pcam" style="width:100%">Take / choose photo</button>
        <button class="btn gh" id="prm" style="width:100%;margin-top:7px">Clear photo</button>
      </div>
    </div>
    <label>Or pick one of your products</label>
    <div id="pk">${lib()}</div>
    <label>Name</label><input type="text" id="fn" value="${esc(it.name)}" placeholder="e.g. Sooper Biscuit">
    <div class="frow">
      <div><label>Cost price (Rs.)</label><input type="number" id="fc" value="${it.cost}" inputmode="numeric"></div>
      <div><label>Selling price (Rs.)</label><input type="number" id="fp" value="${it.price}" inputmode="numeric"></div>
    </div>
    ${isNew
      ? `<label>Opening stock</label><input type="number" id="fs" value="0" inputmode="numeric">
         <div class="hd-hint" style="margin-top:4px">Recorded as the first delivery, at the cost price above, so it shows in Stock Added.</div>`
      : `<label>Stock on the shelf</label>
         <div class="hd-hint" style="margin:2px 0 6px;font-size:13px"><b style="color:var(--txt);font-size:16px">${it.stock}</b>
           &nbsp;— to add stock, tap <b>+</b> on this item in the Stock tab. It goes in at the cost price above.</div>`}
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <input type="checkbox" id="fa" ${it.active!==false?"checked":""} style="width:auto"> Show in Sell screen
    </label>
    <div class="mrow">
      <button class="btn gh" data-x>Cancel</button>
      ${isNew?"":`<button class="btn rd" id="fdel">Delete</button>`}
      <button class="btn pri" id="fok">Save</button>
    </div>`,
  ()=>{
    const LIBNAMES = new Set(PRODUCTS.map(p=>p[1].trim().toLowerCase()));
    function redraw(){ $("pk").innerHTML = lib(); $("pth").innerHTML = thumb(); bind(); }
    function bind(){
      $("ep").querySelectorAll("button").forEach(b=> b.onclick = ()=>{
        photo = b.dataset.p;
        const hit = PRODUCTS.find(p=>("./products/"+p[0]+".png")===photo);
        const nm  = $("fn");
        const cur = nm.value.trim().toLowerCase();
        // Follow the picture: replace the name when the box is empty, or when it
        // still holds a stock product name (i.e. an earlier pick). A name the
        // owner typed himself is never overwritten.
        if(hit && (!cur || LIBNAMES.has(cur))) nm.value = hit[1];
        redraw();
      });
    }
    bind();
    $("pcam").onclick = ()=> pickPhoto(d => { photo = d; redraw(); toast("Photo added"); });
    $("prm").onclick  = ()=> { if(!photo){ toast("No photo set", true); return; } photo = ""; redraw(); };

    $("fok").onclick = async ()=>{
      const name = $("fn").value.trim();
      const cost = whole($("fc").value), price = whole($("fp").value);
      const stock = isNew ? whole(($("fs")||{}).value) : whole(it.stock);
      if(!name){ toast("Enter a name", true); return; }
      if(name.length > 60){ toast("Name is too long", true); return; }
      if(price > 100000 || cost > 100000 || stock > 100000){ toast("That number looks wrong", true); return; }
      if(price < cost && price > 0 && !confirm("Selling price is below cost price. Save anyway?")) return;
      // The stock box is a SHELF COUNT, not a field on the item. Stock moves
      // as deltas everywhere else, so typing a number here used to change
      // this phone only and be overwritten by the next sync — and it left
      // no trace in the movement log, which makes "stock on that date"
      // wrong from then on. A changed number now goes through record_count:
      // owner-only, logged, and the same on every device.
      // Only a NEW item carries a stock figure through this form, and it is
      // its opening delivery. An existing item's stock is changed with the
      // + button — one button, one meaning — never by typing over it here.
      const stockChanged = isNew && stock > 0;
      if(stockChanged && (!sb || !online)){
        toast("Recording the opening stock needs a connection \u2014 the item was not saved", true); return;
      }
      let obj;
      if(isNew){
        obj = {id:uid(), photo, name, cost, price, stock:0, active:$("fa").checked};
        items.push(obj);
      }else{
        const live = items.find(x=>x.id===id);          // #11 re-find; it may have been synced away
        if(!live){ toast("That item no longer exists", true); closeSheet(); render(); return; }
        Object.assign(live,{photo, name, cost, price, active:$("fa").checked});
        obj = live;
      }
      save(); closeSheet(); render(); toast("Saved");
      await push("itemUpsert", stripItem(obj));
      if(stockChanged){
        try{
          // With a cost price it is a delivery like any other, and shows in
          // Stock Added. Without one there is no price to record, so it goes
          // in as an opening count.
          const r = cost > 0
            ? await sb.rpc("record_purchase", { p_id: obj.id, p_qty: stock, p_unit_cost: cost })
            : await sb.rpc("record_count",    { p_id: obj.id, p_counted: stock, p_note: "opening stock" });
          if(r.error) throw r.error;
          obj.stock = Number(r.data); save();
          await loadStockLog(0);
          render();
        }catch(e){
          toast("Opening stock not recorded: " + (e && e.message ? e.message : "failed"), true);
        }
      }
    };
    const d = $("fdel");
    if(d) d.onclick = async ()=>{
      // Its deliveries go too. Left behind, they showed in Stock Added as a
      // raw database id with no way to clear them — a permanent puzzle in
      // the one record that has to be trustworthy. Sales keep their own
      // lines, because those are money that actually came in.
      if(!confirm("Delete " + it.name + "?\n\nIts delivery history goes with it. Past sales keep their record.")) return;
      items = items.filter(x=>x.id!==it.id);
      stockLog = stockLog.filter(x=>x.item_id!==it.id);
      save(); closeSheet(); render(); toast("Deleted");
      if(sb && online){
        try{ await sb.rpc("delete_item_history", {p_item_id: it.id}); }
        catch(e){ console.warn("delivery history not cleared:", e && e.message); }
      }
      await push("itemDelete",{id:it.id});
    };
  });
}
/* A delivery: how many arrived, and what each one cost.
   The price is the whole point — without it there is no way to say what a
   delivery cost or what has been made on it since. It is pre-filled with
   what was paid last time, so on a normal week it is one tap. */
function restockModal(id){
  if(!isOwner()) return;
  const it = items.find(i=>i.id===id); if(!it) return;
  const last = lastDelivery(id);
  // The price is the item's cost price, set once in Items. A delivery asks
  // only how many — the price stays the same unless it is changed there.
  const unitCost = rupees(it.cost);
  if(unitCost <= 0){
    toast("Set a cost price for " + it.name + " in Items first", true);
    return;
  }

  openSheet(`<h2>Stock arrived</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 10px">
      ${esc(it.name)} — ${it.stock} on the shelf${last
        ? `<br>Last delivery ${new Date(last.at).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}: ${whole(last.delta)} at ${money(last.unit_cost)} each`
        : "<br>First recorded delivery for this item"}
    </p>
    <label>How many arrived?</label>
    <input type="number" id="rq" value="12" inputmode="numeric">
    <div class="hd-hint" style="margin-top:4px">At <b>${money(unitCost)}</b> each — the cost price set in Items. Change it there if the supplier's price has changed.</div>
    <input type="hidden" id="rc" value="${unitCost}">
    <label>When did it arrive?</label>
    <input type="date" id="rd" value="${esc(ymdLocal(new Date()))}" max="${esc(ymdLocal(new Date()))}">
    <div id="rwhen" class="hd-hint" style="margin-top:6px"></div>
    <div id="rtot" style="color:var(--dim);font-size:12.5px;margin:8px 0 2px"></div>
    <div class="mrow"><button class="btn gh" data-x>Cancel</button><button class="btn pri" id="rok">Add to stock</button></div>`,
  ()=>{
    const q = $("rq"), c = $("rc"), t = $("rtot"), dt = $("rd"), when = $("rwhen"), ok = $("rok");
    const logStart = logStartMs();
    const logDay = logStart !== null ? dayOf(new Date(logStart).toISOString()) : null;
    // A delivery dated before the log began is one that ALREADY moved the
    // shelf, back when the old button did that without writing it down.
    // Recording it now must write it down WITHOUT moving the shelf again.
    const isPast = () => !!dt.value && logDay !== null && dt.value < logDay;
    const tot = ()=>{ const n = whole(q.value), u = rupees(c.value);
      t.textContent = (n>0 && u>0) ? `${n} × ${money(u)} = ${money(n*u)}` : "";
      if(n>0 && u>0 && rupees(it.price) > 0 && u >= rupees(it.price))
        t.textContent += "  ⚠ that is more than you sell it for";
      if(isPast()){
        when.innerHTML = `This is before deliveries were being recorded (${esc(niceDay(logDay))}). The units are already counted on the shelf, so this will be <b>written into the history only</b> — the shelf figure will not change.`;
        ok.textContent = "Record past delivery";
      } else {
        when.textContent = dt.value && dt.value !== ymdLocal(new Date()) ? "Dated " + niceDay(dt.value) + " — the stock goes on the shelf now." : "";
        ok.textContent = "Add to stock";
      }
    };
    q.oninput = tot; c.oninput = tot; dt.onchange = tot; tot();

    ok.onclick = async ()=>{
      const n = whole(q.value), unit = rupees(c.value);
      if(n <= 0){ toast("How many arrived?", true); return; }
      if(n > 100000){ toast("That number looks wrong", true); return; }
      if(unit <= 0){ toast("Set a cost price for this item in Items first", true); return; }
      if(!dt.value){ toast("When did it arrive?", true); return; }
      // A delivery is a money record, so it goes to the database or nowhere.
      // Writing it locally would lose the price on the next sync.
      if(!sb || !online){ toast("You need a connection to record a delivery", true); return; }

      ok.disabled = true;
      try{
        if(isPast()){
          // midday on the chosen day: unambiguous, and after the 4am boundary
          const [y,m,d] = dt.value.split("-").map(Number);
          const at = new Date(y, m-1, d, 12, 0, 0, 0).toISOString();
          const r = await sb.rpc("record_purchase_backdated", { p_id:id, p_qty:n, p_unit_cost:unit, p_at:at });
          if(r.error) throw r.error;
        } else {
          const r = await sb.rpc("record_purchase", { p_id:id, p_qty:n, p_unit_cost:unit });
          if(r.error) throw r.error;
          const live = items.find(x=>x.id===id);
          if(live){ live.stock = Number(r.data); live.cost = unit; }
          save();
        }
        await loadStockLog(0);
        closeSheet(); render();
        toast(isPast() ? `Recorded ${n} × ${esc(it.name)} on ${niceDay(dt.value)} · ${money(n*unit)}`
                       : `Added ${n} × ${esc(it.name)} · ${money(n*unit)}`);
      }catch(e){
        ok.disabled = false;
        toast("Not recorded: " + (e && e.message ? e.message : "failed"), true);
      }
    };
  });
}

/* Counting the shelf. The difference is written down rather than absorbed. */
function countModal(id){
  if(!isOwner()) return;
  const it = items.find(i=>i.id===id); if(!it) return;
  openSheet(`<h2>Count the shelf</h2>
    <p style="color:var(--dim);font-size:13px;margin:0 0 10px">
      ${esc(it.name)} — the system says <b>${it.stock}</b>. Count what is actually there.
    </p>
    <label>How many did you count?</label>
    <input type="number" id="cq" value="${it.stock}" inputmode="numeric">
    <div id="cdiff" style="font-size:12.5px;margin:8px 0 2px"></div>
    <div class="mrow"><button class="btn gh" data-x>Cancel</button><button class="btn pri" id="cok">Save count</button></div>`,
  ()=>{
    const q = $("cq"), dv = $("cdiff");
    const show = ()=>{
      const n = whole(q.value), d = n - whole(it.stock);
      dv.innerHTML = d === 0 ? `<span style="color:var(--okl)">Matches — nothing missing</span>`
        : d < 0 ? `<span style="color:var(--bad)">${Math.abs(d)} missing · ${money(Math.abs(d)*rupees(it.cost))} at cost</span>`
        : `<span style="color:var(--warn)">${d} more than expected</span>`;
    };
    q.oninput = show; show();

    $("cok").onclick = async ()=>{
      const n = whole(q.value);
      if(q.value === "" || n < 0){ toast("Enter what you counted", true); return; }
      if(!sb || !online){ toast("You need a connection to save a count", true); return; }
      $("cok").disabled = true;
      try{
        const r = await sb.rpc("record_count", { p_id:id, p_counted:n, p_note:null });
        if(r.error) throw r.error;
        const live = items.find(x=>x.id===id);
        if(live) live.stock = Number(r.data);
        save();
        await loadStockLog(stockLogFrom != null ? stockLogFrom : Date.now() - 90*86400000);
        closeSheet(); render();
        toast("Count saved");
      }catch(e){
        $("cok").disabled = false;
        toast("Not saved: " + (e && e.message ? e.message : "failed"), true);
      }
    };
  });
}

/* ---------- 11b. PHOTO CAPTURE ---------- */
/* Opens the camera or gallery, crops to a square and shrinks it so the
   stored image stays a few KB rather than several MB. */
function pickPhoto(cb){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const S = 220, c = document.createElement("canvas");
        c.width = S; c.height = S;
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0,0,S,S);
        const m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, S, S);
        try{ cb(c.toDataURL("image/jpeg", 0.72)); }
        catch(e){ toast("Could not read that image", true); }
      };
      img.onerror = ()=> toast("Could not read that image", true);
      img.src = fr.result;
    };
    fr.onerror = ()=> toast("Could not read that file", true);
    fr.readAsDataURL(f);
  };
  inp.click();
}

/* ---------- 12. SHEET ---------- */
function openSheet(html, after){
  closeSheet();
  const d = document.createElement("div");
  d.className = "modal"; d.id = "sheet";
  d.innerHTML = `<div class="sheet">${html}</div>`;
  d.onclick = e=>{ if(e.target === d) closeSheet(); };
  document.body.appendChild(d);
  d.querySelectorAll("[data-x]").forEach(b=> b.onclick = closeSheet);
  if(after) after();
}
function closeSheet(){ const s = $("sheet"); if(s) s.remove(); }

/* ---------- 13. BOOT ---------- */
$("btnPay").onclick   = checkout;
$("btnClear").onclick = ()=>{ cart = {}; save(); render(); };
$("btnOut").onclick   = logout;
const bs = $("btnSound");
if(bs){
  const paint = ()=>{ bs.textContent = Sound.enabled ? "\u{1F50A}" : "\u{1F507}";
                      bs.style.opacity = Sound.enabled ? "1" : ".55"; };
  paint();
  bs.onclick = ()=>{ const nowOn = Sound.toggle(); paint(); toast(nowOn ? "Sound on" : "Sound off"); };
}
const ag = $("authGo"); if(ag) ag.onclick = signIn;
const ap = $("authPass"); if(ap) ap.addEventListener("keydown", e=>{ if(e.key === "Enter") signIn(); });
/* No manual refresh button. The app keeps itself current:
   - live updates arrive over the realtime channel
   - the queue flushes the moment the connection returns
   - and it quietly re-syncs whenever the app is brought back to the front. */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ save(); return; }
  if(sb && user && !realtimeAlive() && !rtRetry) subscribeRealtime();
  if(sb){ flushQueue().then(()=>pull(true)).catch(()=>{}); }
});
window.addEventListener("pagehide", save);
window.addEventListener("beforeunload", save);
window.addEventListener("online",  verifyConnection);
/* Safari fires online/offline events unreliably (especially on a file:// page),
   and a false "offline" silently stops syncing. So treat the event as a hint
   and confirm it with a real request before believing it. */
let checking = false;
async function verifyConnection(){
  if(!sb || checking) return;
  checking = true;
  try{
    const { error } = await sb.from("items").select("id").limit(1);
    if(error) throw error;
    setNet(true, "Synced");
    flushQueue();
  }catch(e){
    setNet(false, "Offline — saved on device");
  }finally{
    checking = false;
  }
}
window.addEventListener("offline", verifyConnection);

/* One soft tap for every other button, without wiring each one by hand. */
document.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || b.disabled) return;
  if(b.classList.contains("qb")) return;      // +/- have their own sounds
  if(b.dataset.tab) return;                   // tabs have their own
  if(b.id === "btnPay") return;               // the sale chime covers this
  Sound.unlock();
  Sound.tap();
}, true);

load();
buildKeys();
showLogin();
restoreSession();

if(!checkStorage()){
  const note = document.createElement("div");
  note.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#E53935;"
    + "color:#fff;padding:11px 14px;font-size:13px;font-weight:700;text-align:center";
  note.textContent = location.protocol === "file:"
    ? "This browser will not save data from a file:// page. Upload the folder and open it over http/https."
    : "This browser is blocking storage (private mode?). Sales will NOT be saved.";
  document.body.appendChild(note);
}

/* ---------- 14. OFFLINE SERVICE WORKER ---------- */
/* Registers only when served over http(s). Fails silently if sw.js is absent,
   so the app still works if you upload index.html on its own. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(err => console.warn("offline cache unavailable:", err && err.message));
  });
}
